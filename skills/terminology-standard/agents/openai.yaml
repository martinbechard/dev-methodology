  display_name: Terminology Standard
  # User-facing summary shown in Codex skill surfaces.
  short_description: Apply preferred project and shared user terminology from terminology.md when writing or revising...
  # Prompt Codex can use when launching this skill directly.
  default_prompt: Use $terminology-standard for work covered by this skill.

# Optional invocation policy placeholder.
# policy:
