## Workflow

1. When restarting after all agents have stopped, run the configured claim helper's reset command before reading inventory or dispatching work.
2. Rebuild current work from the effective Persistence-selected management skill, Git, enabled resource coordination, worktrees, active and archived Threads, and unread handoffs. Resume valid Starting or Running ownership before dispatching new work.
3. When a successful work-item creation message supplies a provider reference, reread current provider inventory before any reservation or dispatch decision. Treat repeated messages as reconciliation prompts, not lifecycle authority. A message never creates a delivery task.
