schema: dev-methodology-eval-judges
version: 2
coverageStatus: declared
sourceDigestPolicy: sha256-at-run
judgeTypes:
  deterministic:
    name: Deterministic Judge
    purpose: Decide exact, executable, schema, trace, mutation, and state-transition conditions.
    calibrationRequired: false
  model:
    name: Model Judge
    purpose: Judge semantic completeness, source faithfulness, prioritization, and handoff quality only where exact checks are insufficient.
    calibrationRequired: true
  human:
    name: Human Judge
    purpose: Create calibration labels and adjudicate ambiguous, disputed, or high-risk results.
    calibrationRequired: false
executionOrder:
  - deterministic-critical-gates
  - deterministic-behavior-checks
  - calibrated-model-judge-when-needed
  - second-model-pass-or-human-adjudication-when-triggered
executionPolicy:
  requiredPreflightChecks:
    - model-input-safety
    - snapshot-reset
    - local-execution-boundary
  skipModelJudgeAfterCriticalDeterministicFailure: true
  normalModelPasses: 1
  secondPassTriggers:
    - near-threshold
    - conflicting-evidence
    - high-risk-result
  blindModelJudgeTo:
    - treatment
    - expected-winner
    - evaluated-model-identity
    - harness-identity-unless-harness-behavior-is-the-target
checks:
  - id: model-input-safety
    type: deterministic
    critical: true
    description: Preflight inventories only the explicitly staged context pack, rejects seeded secrets, PII, and company-sensitive patterns unless specifically approved, and records the approved context-pack SHA-256 digest.
  - id: skill-read-trace
    type: deterministic
    critical: true
    description: A unique captured tool event identifies the loaded skill and its run-time SHA-256 digest.
  - id: forbidden-skill-absence
    type: deterministic
    critical: true
    description: Captured events contain no read of a skill declared forbidden for the treatment.
  - id: harness-agent-identity
    type: deterministic
    critical: true
    description: Captured harness evidence identifies the intended conceptual agent definition and concrete invocation.
  - id: required-command-outcome
    type: deterministic
    critical: true
    description: Each required command has the declared exit-code and pass or expected-failure outcome.
  - id: project-hash-policy
    type: deterministic
    critical: true
    description: Before and after project hashes satisfy the scenario mutation policy.
  - id: allowed-paths-only
    type: deterministic
    critical: true
    description: Every changed path is inside the case allow-list and no unrelated file changed.
  - id: no-forbidden-mutation
    type: deterministic
    critical: true
    description: Read-only and non-authoritative scenarios leave the protected workspace state unchanged.
  - id: output-contract-presence
    type: deterministic
    critical: true
    description: Every required conceptual agent definition output-contract field is present and non-empty.
  - id: source-link-resolution
    type: deterministic
    critical: false
    description: Declared project-relative source and documentation links resolve from the artifact location.
  - id: artifact-structure
    type: deterministic
    critical: true
    description: Required headings, keys, statuses, and ordering match the owning template or schema.
  - id: artifact-review-checklist
    type: deterministic
    critical: true
    description: The named review checklist exists, covers every applicable item, and precedes findings synthesis.
  - id: read-only-boundary
    type: deterministic
    critical: true
    description: The reviewer leaves every protected target and source artifact unchanged while producing only explicitly requested review evidence.
  - id: checklist-completeness
    type: deterministic
    critical: true
    description: Each completed generic and applicable specialized checklist preserves every canonical objective question exactly once in source order and completes every source-defined evidence field.
  - id: evidence-quotes
    type: deterministic
    critical: false
    description: Completed checklist records contain nonempty quoted-evidence fields tied to the reviewed target or accepted source inputs.
  - id: verifier-assessment
    type: deterministic
    critical: true
    description: The retained review evidence includes an independent page-verifier assessment rather than an unsupported reviewer assertion.
  - id: finding-priority
    type: deterministic
    critical: false
    description: Material findings precede acceptance language and include an explicit impact-based priority.
  - id: authority-gap-presence
    type: deterministic
    critical: true
    description: Missing policy or specialized review authority produces an explicit blocker and identifies the evidence required to review the unavailable dimensions.
  - id: no-checklist-substitution
    type: deterministic
    critical: true
    description: Missing specialized authority preserves the complete generic checklist and does not introduce an unrelated or rewritten checklist.
  - id: finding-recall
    type: deterministic
    critical: true
    description: Required seeded findings are reported with the expected identifiers and locations.
  - id: finding-precision
    type: deterministic
    critical: false
    description: Reported findings match the seeded defect inventory and unsupported findings are counted.
  - id: fresh-context-identity
    type: deterministic
    critical: true
    description: Review and verification invocations have distinct captured context identities from production work.
  - id: claim-lifecycle
    type: deterministic
    critical: true
    description: Claim events prove acquisition, non-overlap handling, commit or truthful no-change, clean state, and release.
  - id: file-backed-workitem-ownership
    type: deterministic
    critical: true
    description: Each Running work-item file records one canonical Dev Orchestrator task identifier, branch, worktree, current phase, candidate commit, claim waits, open issues, and delivery evidence without a separate task or baton registry.
  - id: running-capacity-refill
    type: deterministic
    critical: true
    description: File-backed Running items are counted toward a target of ten, non-running states and waiting tasks are excluded, and every terminal cleanup immediately dispatches eligible Ready work to refill capacity or reports a real shortage.
  - id: bounded-claim-retry
    type: deterministic
    critical: true
    description: Integration and work-item completion claims use separate windows with one immediate attempt plus retries at five, ten, fifteen, twenty, twenty-five, and thirty minutes, stop after acquisition, and trigger parent investigation at thirty minutes.
  - id: direct-orchestrator-integration
    type: deterministic
    critical: true
    description: Without a pull request, the same canonical Dev Orchestrator that owns the work item acquires the exact main-file claim, integrates the accepted commit, runs focused tests, releases, completes the work item under a separate claim, and returns cleanup eligibility to the parent.
  - id: focused-item-verification
    type: deterministic
    critical: true
    description: Each item runs the smallest project-native tests covering changed behavior and credible regression risk; the complete agent catalog is reserved for the final integrated campaign state.
  - id: workitem-completion-handoff
    type: deterministic
    critical: true
    description: Work-item completion requires integrated delivery, review, focused verification, distinct released integration and completion claims, a clean worktree, and a fully merged branch; parent worktree, branch, title, and task archival cleanup follows that committed disposition.
  - id: archive-eligibility
    type: deterministic
    critical: true
    description: A task is archive-eligible only after a committed terminal disposition, required delivery or blocker evidence, released claims and resources, clean or appropriately preserved worktrees, and no unresolved baton, wake, or notification obligation.
  - id: archive-no-persist
    type: deterministic
    critical: true
    description: 'The exact "Inactive thread archive did not persist" result is treated as ambiguous and non-persisted, reconciled once, never blindly retried, and never reported as archived.'
  - id: canonical-id-persistence
    type: deterministic
    critical: true
    description: One reconciled canonical task identifier remains stable across title changes, wake-ups, duplicate containment, dormant parking, and terminal archival.
  - id: completion-evidence-gate
    type: deterministic
    critical: true
    description: Completed or READY is refused until delivery, independent review, verification, integration or shared finalization, clean release, any applicable final catalog run, and terminal backlog evidence are complete.
  - id: concrete-successor-chain
    type: deterministic
    critical: true
    description: The wake ledger exactly matches the fixture-declared ordered labels and stable task identifiers, including the Wiki Research to Hibernate/Panache edge.
  - id: continuous-lane-routing
    type: deterministic
    critical: true
    description: Each finished contribution advances immediately to its next required gate while unrelated lanes continue without a batch barrier.
  - id: delayed-visibility-settlement
    type: deterministic
    critical: true
    description: An ambiguous task creation followed by an empty immediate read requires one bounded settlement interval and a second active-and-archived reconciliation before any retry.
  - id: dependency-identity-and-order
    type: deterministic
    critical: true
    description: Coordination uses only the declared steward and orchestrator identities and preserves the required lifecycle, review, verification, and integration order.
  - id: one-nested-dependency-at-a-time
    type: deterministic
    critical: true
    description: Captured dependency-session lifetimes prove that no more than one nested dependency is active at a time.
  - id: committed-handoffs
    type: deterministic
    critical: true
    description: Every modifying contribution and integration handoff is bound to a commit from a clean claimed worktree before downstream work begins.
  - id: structured-handoff-receipts
    type: deterministic
    critical: true
    description: Source, documentation, integration, and closeout handoff receipts each record lane, role, commit, review, verification, and claim-release evidence; prose summaries do not substitute for receipts.
  - id: post-integration-reviews
    type: deterministic
    critical: true
    description: Fresh independent reviewers accept every changed source and non-source surface after integration before final integrated verification begins.
  - id: done-success-title
    type: deterministic
    critical: true
    description: A successful terminal task receives exactly Done — followed by a nonempty item title, and only after every terminal evidence gate passes.
  - id: duplicate-containment
    type: deterministic
    critical: true
    description: Duplicate tasks stop before any claim or mutation, have zero mutation verified, and are archived when supported; renaming a duplicate does not count as containment.
  - id: exact-decision-provenance
    type: deterministic
    critical: true
    description: The exact user answer and source are recorded once and drive only the Ready, Holding, or terminal decision disposition, never delivery completion.
  - id: fifteen-minute-wake-audit
    type: deterministic
    critical: true
    description: Every fifteen minutes while an obligation remains, the parent repairs missing evidence, notification, or acknowledgement, sends at most one evidence-bearing wake, records acknowledgement, and never requires child polling.
  - id: just-in-time-dispatch
    type: deterministic
    critical: true
    description: Only tasks able to enter the current lifecycle or artifact window stay active; dormant preflights preserve their canonical identifier and handoff while parked.
  - id: lifecycle-baton-evidence
    type: deterministic
    critical: true
    description: A lifecycle baton records the exact commit, release and scope, owner task, role, and claim, clean primary HEAD and status, registry state, designated successor, precise next mutation, decision provenance, and parent acknowledgement before wake-up.
  - id: phase-order
    type: deterministic
    critical: true
    description: READ-ONLY PREFLIGHT, LIFECYCLE START, ARTIFACT GO, ARTIFACT WAIT, and ARTIFACT RESUME occur in that exact precedence, with GO only after durable release, WAIT on contention, and RESUME only from an evidence-bearing parent wake.
  - id: retry-limit
    type: deterministic
    critical: true
    description: Task creation retries at most once and only after both immediate and settled reconciliations are empty; the same settlement follows the retry before a BLOCKED result.
  - id: settled-zero-retry
    type: deterministic
    critical: true
    description: When settled reconciliation exposes matching tasks, creation is not retried; one task is adopted as canonical and every duplicate is contained.
  - id: suite-simulator-tests
    type: deterministic
    critical: true
    description: Every simulator test declared by the current suite digest passes with a complete command receipt.
  - id: task-identity-fields
    type: deterministic
    critical: true
    description: Task reconciliation matches source parent identifier, canonical backlog path, normalized objective or prompt, creation time, and status across active and archived tasks; title alone is never sufficient.
  - id: mcp-tool-trace
    type: deterministic
    critical: true
    description: Evaluator-owned session-bound audit evidence selects one process stream that completed every required tool sequence with the expected privacy-safe argument digest and accepted nonempty domain outcome bound to the same call, with no failed or incomplete calls.
  - id: test-state-transition
    type: deterministic
    critical: false
    description: Captured focused test evidence proves the expected red-to-green or failure-to-classified transition.
  - id: technology-detection-evidence
    type: deterministic
    critical: true
    description: Detection output matches source activation evidence, runtime availability, conflicts, and NO_VARIANT rules.
  - id: wiki-validation
    type: deterministic
    critical: true
    description: Required leaf-link, lint, status, and applicable OKF checks pass for the changed page inventory.
  - id: raw-processed-boundary
    type: deterministic
    critical: true
    description: Raw sources move only after a GOOD pre-move verdict and link changes receive the required post-move verdict.
  - id: queue-state-transition
    type: deterministic
    critical: true
    description: Backlog or wiki queue state follows allowed transitions and terminal evidence requirements.
  - id: generated-output-freshness
    type: deterministic
    critical: true
    description: Generated adapters and documentation data match their current source digests and check-mode generators.
  - id: agent-dependency-routing
    type: deterministic
    critical: true
    description: Captured delegation events use required agents and do not substitute same-owner review or verification.
  - id: correction-loop-cap
    type: deterministic
    critical: true
    description: Correction attempts stop at the conceptual agent definition or skill cap and produce the required terminal status.
  - id: operation-coverage
    type: deterministic
    critical: true
    description: Every seeded exact route, command, event, job, lookup, or side effect has an explicit coverage row.
  - id: actor-boundary-coverage
    type: deterministic
    critical: true
    description: Every seeded actor and protected operation has an explicit applicable, denied, equivalent, or out-of-scope boundary row.
  - id: contradiction-scan
    type: deterministic
    critical: true
    description: Known mutually exclusive contract assertions are not both accepted by the produced artifact.
  - id: readiness-consistency
    type: deterministic
    critical: true
    description: READY or pass is forbidden while a critical requirement, contract conflict, or blocking question remains unresolved.
  - id: no-sensitive-output
    type: deterministic
    critical: true
    description: Captured prompts, outputs, logs, and artifacts contain none of the seeded secrets, tokens, PII, or forbidden payloads.
  - id: tool-authority
    type: deterministic
    critical: true
    description: Tool calls and side effects stay inside declared authority and preserve denied-action evidence.
  - id: external-effect-phase
    type: deterministic
    critical: true
    description: External or asynchronous effects preserve seeded initiator, submission, execution, completion, and failure phases.
  - id: paired-run-lift
    type: deterministic
    critical: false
    description: A skill-on run improves the target score over its matched skill-omitted run without weakening critical gates.
  - id: wrong-skill-noninterference
    type: deterministic
    critical: false
    description: Replacing the target with an irrelevant skill does not receive target-skill credit or bypass activation checks.
  - id: snapshot-reset
    type: deterministic
    critical: true
    description: The run begins from the declared prepared-snapshot digest and discards all writable state afterward.
  - id: local-execution-boundary
    type: deterministic
    critical: true
    description: The run uses a disposable workspace, controlled harness configuration and environment, mutation auditing, a wall-clock timeout with process cleanup, and a disjoint runner-owned evidence path.
  - id: calibrated-model-judge
    type: deterministic
    critical: true
    description: A Model Judge verdict references a matching calibration record whose metrics meet policy thresholds.
rubrics:
  - id: artifact-contract
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - id: completeness
        description: All applicable requirements and required sections are accounted for, including exact operations and supporting behavior.
      - id: asserted-claim-correctness
        description: Claims that are made agree with the allowed authoritative evidence.
      - id: contradiction
        description: The artifact does not accept mutually inconsistent contracts or erase source conflicts.
      - id: readiness
        description: READY, BLOCKED, pass, or fail agrees with unresolved requirements and critical questions.
      - id: operation-coverage
        description: Exact routes, commands, events, jobs, lookups, side effects, and route variants remain one-to-one traceable.
      - id: actor-boundary-coverage
        description: Anonymous, authenticated, administrator, service, background, and other applicable actors are treated explicitly.
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
      minimumDimensionScores:
        contradiction: 4
      criticalDimensions:
        - completeness
        - contradiction
        - readiness
      criticalCompletenessRequired: true
      readinessMustBeConsistent: true
  - id: review-quality
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - evidence-grounding
      - required-finding-prioritization
      - uncertainty-separation
      - correction-actionability
      - residual-risk-clarity
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
  - id: workflow-quality
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - responsibility-boundaries
      - handoff-completeness
      - dependency-order
      - failure-ownership
      - terminal-status-integrity
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
  - id: source-faithfulness
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - authority-order
      - citation-support
      - inference-labeling
      - source-conflict-preservation
      - scope-discipline
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
  - id: diagnosis-quality
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - reproduction-quality
      - competing-hypotheses
      - earliest-divergence
      - mechanism-level-cause
      - verification-path
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
  - id: security-quality
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - attack-path-plausibility
      - exploit-preconditions
      - protected-impact
      - correction-boundary
      - residual-risk
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
  - id: ux-quality
    type: model
    scale: 0-to-4-per-dimension
    dimensions:
      - task-flow-coverage
      - accessibility-evidence
      - state-and-recovery-coverage
      - preference-separation
      - recommendation-actionability
    passRules:
      noAggregateCompensation: true
      minimumDimensionScore: 3
calibrationPolicy:
  requiredBeforeJudgeCalibrationClaim: true
  status: pending
  promotionStatus: disabled-pending-provenance
  missingOrPendingResult: calibration-pending
  promotionPrerequisites:
    - Each sample binds a canonical Model Judge request and validated output artifact.
    - Model harness, model identity, and reasoning profile come from a trusted invocation event.
    - Human labels and ambiguous-case adjudication bind to independently captured evidence.
    - Calibration coverage includes every critical rubric dimension.
  scope: Calibration applies to Model Judge reliability claims only. Raw Judge outcomes, deterministic outcomes, execution, and security containment remain separate claims.
  humanScoredSet:
    pilotMinimumExamples: 20
    minimumExamples: 25
    minimumExamplesPerClass: 5
    minimumCriticalDefects: 5
    requiredClasses:
      - clear-pass
      - clear-fail
      - boundary
      - incomplete-plausible
      - adversarially-polished
    ambiguousExamples:
      independentHumanJudges: 2
      adjudicationRequired: true
  agreementMetrics:
    binary:
      - precision
      - recall
      - f1
    ordered:
      - weighted-kappa
    critical:
      - recall
  thresholds:
    binaryF1: 0.85
    orderedWeightedKappa: 0.70
    criticalDefectRecall: 1.0
  recordedDigests:
    required:
      - judgePromptSha256
      - judgeOutputSchemaSha256
      - instructionEnvelopeSha256
      - harness
      - judgeModelIdentity
      - reasoningProfile
      - rubricSha256
      - calibrationSetSha256
  recalibrationTriggers:
    - Judge prompt changes materially
    - Judge model identity changes
    - reasoning profile changes
    - rubric or pass rules change
    - calibration set changes materially
  records: []
