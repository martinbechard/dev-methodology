        skill_validate:
          paths: [$SKILL_ROOT]
        skill_refresh: {}
        detect_technology_skills:
          project_root: $WORKSPACE
          scopes: [services/api, apps/web, automation]
        claim_acquire:
          repository: $WORKSPACE
          claim_id: project-configuration-routing
          agent: project-configurator
          task: project-configuration-routing
          root_task_id: project-configuration-routing
          project_files: true
          scope_reason: evaluation output ownership
        claim_status:
          repository: $WORKSPACE
        claim_heartbeat:
          repository: $WORKSPACE
          claim_id: project-configuration-routing
        verify_yaml:
          repository_root: $WORKSPACE
          paths: [PROJECT.yaml]
        verify_markdown_links:
          repository_root: $WORKSPACE
          patterns: [eval-result.md, mcp-operation-evidence.md]
        claim_release:
          repository: $WORKSPACE
          claim_id: project-configuration-routing
