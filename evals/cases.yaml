  - id: project-configuration-routing
    coverageStatus: fixture-backed
    executionStatus: runnable
    project: evals/projects/project-configuration-routing
    task: TASK.md
    allowedWritePaths: [PROJECT.yaml, eval-result.md, mcp-operation-evidence.md]
    ephemeralWritePaths: []
    install: null
    verify:
      argv:
        - python3
        - -c
        - |
          from pathlib import Path
          required = [Path("PROJECT.yaml"), Path("eval-result.md"), Path("mcp-operation-evidence.md")]
          missing = [str(path) for path in required if not path.is_file()]
          nested = [path for path in Path(".").rglob("PROJECT.yaml") if path != Path("PROJECT.yaml")]
          guidance = [path for path in Path(".").rglob("AGENTS.md")]
          message = ("missing required output: " + ", ".join(missing)) if missing else (("nested PROJECT.yaml forbidden: " + ", ".join(map(str, nested))) if nested else (("guidance forbidden for unavailable helper: " + ", ".join(map(str, guidance))) if guidance else ""))
          raise SystemExit(message if message else 0)
