    mcpAgentOps:
      schemaVersion: 4
      claimResultSchemaVersion: 2
      claimHelperAvailability: UNAVAILABLE
      enablement: base-case-only
      serverName: mcp-agent-ops
      enabledTools: [claim_status, claim_acquire, claim_extend, claim_heartbeat, claim_release, claim_maintain_journal, claim_report, skill_list, skill_load, skill_resource_load, skill_refresh, skill_validate, detect_technology_skills, verify_yaml, verify_markdown_links]
      mcpOnlySkills: [skill-authoring, maintain-methodology-documentation]
      requiredVersion: 0.4.0
      requiredRuntimeDigest: b4abdd4054a3b6181d2cc48d4c9de6b4fbbc29eb6fd256e0427d861e2ae1620d
      skillCatalogSource: available-skills.txt
      catalogResourceAllowlist:
