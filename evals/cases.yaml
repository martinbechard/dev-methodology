        route-documentation-work: [assets/templates/project-template.yaml]
      requiredToolSequences:
        - [skill_list, skill_load, skill_resource_load, skill_validate, skill_refresh, detect_technology_skills, claim_acquire, claim_status, claim_heartbeat, verify_yaml, verify_markdown_links, claim_release]
      requiredToolOutcomes:
        skill_list: [CATALOG]
        skill_load: [LOADED]
        skill_resource_load: [LOADED]
        skill_validate: [VALID]
        skill_refresh: [CATALOG]
        detect_technology_skills: [READY, NO_VARIANT]
        claim_acquire: [SHARED_CHECKOUT_ACQUIRED]
        claim_status: [STATUS]
        claim_heartbeat: [HEARTBEAT]
        verify_yaml: [OK]
        verify_markdown_links: [OK]
        claim_release: [RELEASED]
