          marker_counts = {marker: text.count(f"[{marker}]") for marker in expected_terms}
          missing_terms = [
              {"marker": marker, "preferredTerm": term}
              for marker, term in expected_terms.items()
              if marker not in blocks or not contains(blocks[marker], term)
          ]
          missing_literals = [literal for literal in protected_literals if literal not in text]
          candidate_occurrences = [
              {"candidate": candidate, "marker": marker}
              for marker, candidate in scratchpad_candidates.items()
              if marker in blocks and contains(blocks[marker], candidate)
          ]
          evidence = {
              "artifact": artifact.name,
              "semanticMarkersValid": all(count == 1 for count in marker_counts.values()),
              "markerCounts": marker_counts,
              "preferredTerminologyValid": not missing_terms,
              "missingPreferredTerms": missing_terms,
              "protectedLiteralsValid": not missing_literals,
              "missingProtectedLiterals": missing_literals,
              "structureValid": text.startswith("# "),
              "scratchpadCandidateOccurrences": candidate_occurrences,
              "scratchpadCandidatesNormative": False,
          }
          evidence["passed"] = all((evidence["semanticMarkersValid"], evidence["preferredTerminologyValid"], evidence["protectedLiteralsValid"], evidence["structureValid"]))
          print(json.dumps(evidence, indent=2, sort_keys=True))
          raise SystemExit(0 if evidence["passed"] else 3)
