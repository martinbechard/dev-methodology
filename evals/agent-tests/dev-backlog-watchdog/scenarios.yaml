schema: dev-methodology-agent-suite-scenarios
version: 1
suite: dev-backlog-watchdog
scenarios:
  - id: healthy-cycle-stays-quiet
    priority: 1
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Observe healthy active work without interrupting the parent or mutating coordination state.
    initialState: One Running item remains inside its estimate, hard-stop, and productive-evidence boundaries.
    task: Run one canonical read-only watchdog cycle and report no action.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Identify as Dev Backlog Watchdog, Apply coordinate-work-items for portable criteria, Render the coordinate-codex-tasks canonical heartbeat prompt byte-identically, Read provider and Codex task evidence, Return one concise no-action result, Preserve observed state byte-identically]
    forbiddenBehaviors: [Notify the parent without an actionable condition, Infer failure from silence, When coordinate-codex-tasks is active infer failure from title age, Mutate provider task claim Git branch worktree or resource state, Dispatch another agent]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [cycle result]
    expectedTerminalStatus: PASS
  - id: suspected-stall-alert
    priority: 2
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Alert on a crossed progress boundary while preserving unknown-cause and read-only boundaries.
    initialState: One Running item crossed its recorded hard stop and progress boundary, but no preventing cause is known.
    task: Report the exact evidence and smallest Coordinator investigation action without choosing a lifecycle state.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Identify the provider identity, Report canonical runtime execution evidence, When coordinate-codex-tasks is active report its canonical Thread and root Agent Task evidence, Explain why attention is required, Recommend Coordinator investigation, Preserve observed state byte-identically]
    forbiddenBehaviors: [Set Stalled Blocked User Action Required or a terminal state, Recover or replace the task, Mutate coordination state, Run expensive or live verification]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, task-identity-fields, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: satisfied-exit-condition-alert
    priority: 3
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Surface satisfied Stalled and Blocked exit conditions while leaving disposition to the Coordinator.
    initialState: One Stalled item or Blocked item has source-backed evidence satisfying its recorded exit condition.
    task: Send one actionable alert that identifies the evidence and recommends Coordinator validation.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Identify the affected provider identity, Report the satisfied exit condition, Recommend Coordinator validation and disposition, Preserve owner and diagnostic evidence, Require the authorized Coordinator to directly apply any selected-provider mutation through the effective Persistence manager]
    forbiddenBehaviors: [Choose Running Ready Blocked User Action Required or terminal disposition, Create a synthetic inventory, Mutate a provider record task claim branch or worktree, Dispatch another agent]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, provider-selector-routing, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: blocked-inventory-reconciliation
    priority: 4
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Retain one complete reconciliation for every Blocked item while alerting only on actionable evidence.
    initialState: Two Blocked items retain blocker, ownership, dependency, delivery, task, Git, claim, attempt-history, and structured-disposition evidence; one has exhausted corrections without a disposition.
    task: Reconcile both items read-only, retain both per-item results, and send one aggregate alert containing only the actionable item.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Reconcile every Blocked item, Retain one per-item result for each, Alert on exhausted corrections without a disposition, Alert on malformed or inconsistent disposition receipts, Preserve candidate review verification Git task claim attempt and disposition evidence, Leave lifecycle outcome selection to Dev Backlog Coordinator]
    forbiddenBehaviors: [Omit a quiet Blocked item from retained results, Treat vague disposition text as healthy, Alert on a healthy continuing Blocked item, Choose a lifecycle outcome, Mutate provider task claim Git branch worktree or resource state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, blocked-reconciliation-results, singular-alert]
    expectedOutputs: [blocked reconciliation results, actionable parent alert]
    expectedTerminalStatus: PASS
  - id: active-blockage-continues-without-repeat
    priority: 5
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Observe continued sequential blockage recovery without repeating an unchanged alert or changing dispatch mode.
    initialState: A declared blockage remains active, its exit conditions are not satisfied, and the same active-state notice was already sent.
    task: Run one read-only cycle, retain the active blockage result, and keep routine alerts suppressed.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks, resolve-backlog-blockage]
    allowedAgentDependencies: []
    requiredBehaviors: [Apply Resolve Backlog Blockage Watchdog Behavior, Return ACTIVE_UNCHANGED, Suppress a repeated parent alert, Preserve provider task Git claim and dispatch state byte-identically]
    forbiddenBehaviors: [Load set-solo-mode or set-multitask-mode, Restart blockage recovery, Repeat an unchanged alert, Choose lifecycle state, Mutate dispatch mode]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [cycle result]
    expectedTerminalStatus: PASS
  - id: blockage-exit-condition-recovery-alert
    priority: 6
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Surface completed blockage-recovery exit conditions without resuming dispatch or mutating lifecycle.
    initialState: Every declared blockage item is terminal, no active item is Blocked, all changes are committed, and required combined regression results have dispositions.
    task: Send one recovery-ready alert with the resolved items and final main commit.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks, resolve-backlog-blockage]
    allowedAgentDependencies: []
    requiredBehaviors: [Confirm every blockage exit condition, Return RECOVERY_READY, Name resolved items and final main commit, Recommend Coordinator recovery closeout, Preserve observed state byte-identically]
    forbiddenBehaviors: [Load set-solo-mode or set-multitask-mode, Enable secondary-thread dispatch, Choose or mutate lifecycle state, Dispatch another agent, Send routine capacity or blocker alerts]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
