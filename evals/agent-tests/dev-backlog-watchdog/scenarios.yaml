schema: dev-methodology-agent-suite-scenarios
version: 1
suite: dev-backlog-watchdog
scenarios:
  - id: healthy-cycle-stays-quiet
    priority: 1
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Observe healthy active work without interrupting the parent or mutating coordination state.
    initialState: One Running item remains inside its estimate, hard-stop, and productive-evidence boundaries.
    task: Run one canonical read-only watchdog cycle and report no action.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Identify as Dev Backlog Watchdog, Apply coordinate-work-items for portable criteria, Render the coordinate-codex-tasks canonical heartbeat prompt byte-identically, Read provider and Codex task evidence, Return one concise no-action result, Preserve observed state byte-identically]
    forbiddenBehaviors: [Notify the parent without an actionable condition, Infer failure from silence, When coordinate-codex-tasks is active infer failure from title age, Mutate provider task claim Git branch worktree or resource state, Dispatch another agent]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [cycle result]
    expectedTerminalStatus: PASS
  - id: suspected-stall-alert
    priority: 2
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Alert on a crossed progress boundary while preserving unknown-cause and read-only boundaries.
    initialState: One Running item crossed its recorded hard stop and progress boundary, but no preventing cause is known.
    task: Report the exact evidence and smallest Coordinator investigation action without choosing a lifecycle state.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Identify the provider identity, Report canonical runtime execution evidence, When coordinate-codex-tasks is active report its canonical Thread and root Agent Task evidence, Explain why attention is required, Recommend Coordinator investigation, Preserve observed state byte-identically]
    forbiddenBehaviors: [Set Stalled Blocked User Action Required or a terminal state, Recover or replace the task, Mutate coordination state, Run expensive or live verification]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, task-identity-fields, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: satisfied-exit-condition-alert
    priority: 3
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Surface satisfied Stalled and Blocked exit conditions while leaving disposition to the Coordinator.
    initialState: One Stalled item or Blocked item has source-backed evidence satisfying its recorded exit condition.
    task: Send one actionable alert that identifies the evidence and recommends Coordinator validation.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Identify the affected provider identity, Report the satisfied exit condition, Recommend Coordinator validation and disposition, Preserve owner and diagnostic evidence, Require the authorized Coordinator to directly apply any selected-provider mutation through the effective Persistence manager]
    forbiddenBehaviors: [Choose Running Ready Blocked User Action Required or terminal disposition, Create a synthetic inventory, Mutate a provider record task claim branch or worktree, Dispatch another agent]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, provider-selector-routing, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: blocked-inventory-reconciliation
    priority: 4
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Retain one complete reconciliation for every Blocked item while alerting only on actionable evidence.
    initialState: Two Blocked items retain blocker, ownership, dependency, delivery, task, Git, claim, attempt-history, and structured-disposition evidence; one has exhausted corrections without a disposition.
    task: Reconcile both items read-only, retain both per-item results, and send one aggregate alert containing only the actionable item.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Reconcile every Blocked item, Retain one per-item result for each, Alert on exhausted corrections without a disposition, Alert on malformed or inconsistent disposition receipts, Preserve candidate review verification Git task claim attempt and disposition evidence, Leave lifecycle outcome selection to Dev Backlog Coordinator]
    forbiddenBehaviors: [Omit a quiet Blocked item from retained results, Treat vague disposition text as healthy, Alert on a healthy continuing Blocked item, Choose a lifecycle outcome, Mutate provider task claim Git branch worktree or resource state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, blocked-reconciliation-results, singular-alert]
    expectedOutputs: [blocked reconciliation results, actionable parent alert]
    expectedTerminalStatus: PASS
  - id: active-blockage-continues-without-repeat
    priority: 5
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Observe continued sequential blockage recovery without repeating an unchanged alert or changing dispatch mode.
    initialState: A declared blockage remains active, its exit conditions are not satisfied, and the same active-state notice was already sent.
    task: Run one read-only cycle, retain the active blockage result, and keep routine alerts suppressed.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks, resolve-backlog-blockage]
    allowedAgentDependencies: []
    requiredBehaviors: [Apply Resolve Backlog Blockage Watchdog Behavior, Return ACTIVE_UNCHANGED, Suppress a repeated parent alert, Preserve provider task Git claim and dispatch state byte-identically]
    forbiddenBehaviors: [Load set-solo-mode or set-multitask-mode, Restart blockage recovery, Repeat an unchanged alert, Choose lifecycle state, Mutate dispatch mode]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [cycle result]
    expectedTerminalStatus: PASS
  - id: canonical-title-drift-alert
    priority: 15
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Detect stale or noncanonical conversation titles from current provider lifecycle and Running phase without treating display state as lifecycle authority.
    initialState: One Blocked task is titled Waiting for Help and one Completed task is titled Completed instead of Done.
    task: Compare each canonical task title with the exact title contract and send one aggregate Coordinator alert for reconciliation.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Resolve current provider lifecycle before evaluating title, Require Blocked for the Blocked task, Require Done for the Completed task, Send one aggregate parent alert, Preserve provider and runtime state byte-identically]
    forbiddenBehaviors: [Infer lifecycle from title, Rename a task, Mutate provider task claim Git branch worktree or resource state, Suppress drift because a task is idle terminal or archived]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: finished-bounded-verifier-title-drift
    priority: 16
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Prevent a completed bounded verifier from remaining visibly in the active Verifying phase.
    initialState: A bounded verifier has completed but its runtime title still starts with Verifying.
    task: Derive the title from the bounded runtime outcome and alert the Coordinator to apply Done without changing provider lifecycle.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Observe the bounded verifier outcome, Derive Done from completed runtime state, Send one parent alert, Preserve provider and runtime state byte-identically]
    forbiddenBehaviors: [Treat the verifier title as provider lifecycle, Rename the task, Mutate provider task claim Git branch worktree or resource state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: blocked-agent-recovery-unattended
    priority: 17
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Surface agent-actionable Blocked recovery when no active owner is carrying it.
    initialState: A Blocked item has a concrete technical recovery action but no acknowledged active recovery owner.
    task: Reconcile the item during the ordinary cycle and alert the Coordinator without waiting for an external event.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Obtain current Blocked inventory, Identify unattended agent-actionable recovery, Name the affected Work Item ID, Recommend the smallest Coordinator action, Preserve observed state]
    forbiddenBehaviors: [Wait for an external unblock event, Mutate provider task claim Git branch worktree or resource state, Choose lifecycle outcome]
    deterministicChecks: [suite-simulator-tests, no-forbidden-mutation, blocked-reconciliation-results, singular-alert]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: blocked-agent-recovery-active
    priority: 18
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Suppress duplicate recovery alerts while acknowledged agent-owned recovery remains actively owned.
    initialState: A Blocked item has one concrete recovery action, an acknowledged active owner, and an observable next trigger.
    task: Retain current reconciliation evidence and remain quiet.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Obtain current Blocked inventory, Confirm acknowledged active recovery ownership, Retain reconciliation evidence, Return no action]
    forbiddenBehaviors: [Repeat the acknowledged recovery alert, Mutate provider task claim Git branch worktree or resource state, Invent a new acknowledgment subsystem]
    deterministicChecks: [suite-simulator-tests, no-forbidden-mutation, blocked-reconciliation-results]
    expectedOutputs: [cycle result]
    expectedTerminalStatus: PASS
  - id: blocked-preservation-contradiction
    priority: 19
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Detect when provider preservation evidence contradicts current Git or runtime state.
    initialState: A Blocked provider record says its candidate branch and worktree are preserved, while Git and runtime show them absent and retain only the candidate commit.
    task: Alert the Coordinator to reconcile preservation evidence and restore only the required recovery pointer.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Obtain current Blocked inventory, Compare provider preservation evidence with Git and runtime, Name the contradiction, Recommend the smallest reconciliation action]
    forbiddenBehaviors: [Claim the candidate is lost, Restore a branch or worktree, Mutate provider task claim Git branch worktree or resource state]
    deterministicChecks: [suite-simulator-tests, no-forbidden-mutation, blocked-reconciliation-results, singular-alert]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: blockage-exit-condition-recovery-alert
    priority: 6
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Surface completed blockage-recovery exit conditions without resuming dispatch or mutating lifecycle.
    initialState: Every declared blockage item is terminal, no active item is Blocked, all changes are committed, and required combined regression results have dispositions.
    task: Send one recovery-ready alert with the resolved items and final main commit.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks, resolve-backlog-blockage]
    allowedAgentDependencies: []
    requiredBehaviors: [Confirm every blockage exit condition, Return RECOVERY_READY, Name resolved items and final main commit, Recommend Coordinator recovery closeout, Preserve observed state byte-identically]
    forbiddenBehaviors: [Load set-solo-mode or set-multitask-mode, Enable secondary-thread dispatch, Choose or mutate lifecycle state, Dispatch another agent, Send routine capacity or blocker alerts]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-archive-pause-does-not-pause-cleanup
    priority: 7
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Keep clean worktree and branch cleanup actionable while a valid named-task archival pause is active.
    initialState: One merged terminal task has a current acknowledged archival pause and an independently removable clean worktree.
    task: Reconcile the complete terminal task read-only and alert for cleanup without requesting task archival.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Require explicit current user direction for exact named Codex task archival, Retain exact pause scope evidence and acknowledgement, Report the independently removable clean worktree, Send one aggregate parent alert, Preserve observed state byte-identically]
    forbiddenBehaviors: [Infer inherit or persist a campaign-wide archival pause, Suppress provider claim worktree branch notification or preservation reconciliation, Archive a task, Remove a worktree or branch, Mutate provider task claim Git or runtime state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-default-archival-notification
    priority: 8
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Require archival by default after merge and every ordinary terminal gate passes.
    initialState: One fully reconciled merged terminal task remains unarchived without a valid current named-task pause.
    task: Send one actionable archival notification and reject inferred inherited broad or unacknowledged pause evidence.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Require archival by default, Reject earlier-conversation campaign mismatched missing and unacknowledged pause evidence, Identify the exact Codex task, Preserve observed state byte-identically]
    forbiddenBehaviors: [Treat an earlier conversation as a current pause, Treat a campaign pause as named-task evidence, Return NO_ACTION while archival remains actionable, Archive the task, Mutate runtime state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-preserved-branch-removable-worktree
    priority: 9
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Preserve an evidence-backed non-equivalent source branch without retaining its clean terminal worktree.
    initialState: One terminal task has an acknowledged non-equivalent source branch and a clean independently removable worktree.
    task: Retain the deliberate branch disposition and alert only for the clean worktree removal.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Record the source branch as deliberately preserved, Retain non-equivalent preservation evidence, Report the independently removable clean worktree, Preserve observed state byte-identically]
    forbiddenBehaviors: [Alert again for unchanged acknowledged preservation evidence, Infer that a preserved branch retains its worktree, Delete a branch or worktree, Mutate Git or provider state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-aggregate-all-anomalies
    priority: 10
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Aggregate every actionable anomaly across the complete campaign terminal set.
    initialState: Multiple terminal tasks retain distinct archival claim worktree branch and notification anomalies.
    task: Reconcile every terminal task and send exactly one parent alert naming every anomaly and smallest action.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Inspect every terminal task after the first anomaly, Retain one reconciliation per terminal task, Name every task and anomaly, Send exactly one aggregate parent alert, Preserve observed state byte-identically]
    forbiddenBehaviors: [Stop after the first anomaly, Send fragmented alerts, Omit an unacknowledged action, Choose or perform cleanup archival claim or provider mutation]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-complete-no-action
    priority: 11
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Permit NO_ACTION only after every terminal dimension is completely reconciled.
    initialState: Every campaign terminal task has acknowledged provider claim worktree branch notification preservation and archival disposition.
    task: Retain the complete terminal reconciliation and return one concise no-action result.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Reconcile every terminal task, Confirm every terminal dimension is complete and acknowledged, Return one concise no-action result, Preserve observed state byte-identically]
    forbiddenBehaviors: [Return NO_ACTION with an unacknowledged terminal action, Notify the parent, Mutate provider task claim Git or runtime state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [cycle result]
    expectedTerminalStatus: PASS
  - id: terminal-preservation-alert-deduplication
    priority: 12
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Suppress repeat alerts for unchanged acknowledged preservation and alert again when evidence or cleanup action changes.
    initialState: One retained source branch has unchanged acknowledged evidence; comparison cases change that evidence or make cleanup actionable.
    task: Keep the unchanged case quiet and alert for each changed-evidence or newly actionable cleanup case.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Compare current preservation evidence with its acknowledged evidence, Suppress unchanged preservation alert, Alert on changed evidence, Alert on newly cleanup-eligible branch, Preserve observed state byte-identically]
    forbiddenBehaviors: [Repeat an unchanged preservation alert, Suppress changed evidence, Suppress newly actionable cleanup, Mutate branch disposition]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, singular-alert, output-contract-presence]
    expectedOutputs: [cycle result, actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-failed-abandoned-status-aware
    priority: 13
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Reconcile Failed and Abandoned terminal tasks without inventing a merged delivery gate.
    initialState: Failed and Abandoned tasks have valid terminal evidence, complete claim and cleanup evidence, resolved notifications, and pending archival.
    task: Require task archival, then permit NO_ACTION after archival without requiring merged delivery.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Require valid terminal evidence, Require canonical Codex task identity, Reconcile applicable claim evidence, Reconcile cleanup notification and archival disposition, Apply merged delivery only to Completed, Preserve observed state byte-identically]
    forbiddenBehaviors: [Require code merged for Failed or Abandoned, Return NO_ACTION with missing task identity, Return NO_ACTION with incomplete applicable claim reconciliation, Mutate provider task claim Git or runtime state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [cycle result, actionable parent alert]
    expectedTerminalStatus: PASS
  - id: terminal-claim-applicability-evidence
    priority: 14
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Require explicit claim applicability before terminal reconciliation can return NO_ACTION.
    initialState: Three otherwise complete terminal tasks have unknown, explicitly non-applicable, and applicable-without-release claim evidence.
    task: Alert for unknown applicability and missing applicable release evidence while accepting explicit non-applicability without a fabricated release.
    targetSkills: [coordinate-work-items, coordinate-codex-tasks]
    allowedAgentDependencies: []
    requiredBehaviors: [Keep claim applicability explicit, Alert on unknown applicability, Accept explicit non-applicability without release evidence, Alert when an applicable claim has no live or released evidence, Preserve observed state byte-identically]
    forbiddenBehaviors: [Default missing applicability to non-applicable, Require release evidence for an explicitly non-applicable claim, Return NO_ACTION for unknown or incomplete applicable claim evidence, Mutate claim state]
    deterministicChecks: [harness-agent-identity, suite-simulator-tests, no-forbidden-mutation, output-contract-presence]
    expectedOutputs: [cycle result, actionable parent alert]
    expectedTerminalStatus: PASS
