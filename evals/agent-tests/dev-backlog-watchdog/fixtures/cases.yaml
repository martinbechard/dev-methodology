schema: synthetic-agent-suite-cases
cases:
  healthy-quiet-cycle:
    items:
      - provider_identity: backlog/feature-backlog/quiet.md
        status: Running
        phase: focused verification
        canonical_thread: thread-quiet
        root_task: task-quiet
        last_productive_evidence: focused test started within estimate
    expectedMessage: No actionable watchdog condition observed.
  suspected-stall-alert:
    item:
      provider_identity: backlog/feature-backlog/suspected.md
      status: Running
      phase: integration
      canonical_thread: thread-suspected
      root_task: task-suspected
      last_productive_evidence: candidate commit preserved
      hard_stop: "2026-07-26T16:30:00Z"
      hard_stop_crossed: true
      progress_gap: true
      progress_observation: no evidence-bearing output for 18 minutes
    expectedProviderIdentity: backlog/feature-backlog/suspected.md
    expectedReason: progress boundary crossed while the cause remains unknown
    expectedAction: Coordinator investigates and delegates Stalled only if the evidence justifies it
  known-cause-alert:
    item:
      provider_identity: backlog/defect-backlog/known-cause.md
      status: Running
      phase: integration
      canonical_thread: thread-known-cause
      root_task: task-known-cause
      last_productive_evidence: upstream API returned a permanent authorization error
      progress_gap: true
      progress_observation: retry produced the same authorization error
      preventing_cause: upstream credential is unavailable
    expectedReason: progress boundary crossed with a known preventing cause
    expectedAction: Coordinator validates the cause, blocker owner, unblock condition, and Coordinator-owned action before choosing the Blocked disposition
  capacity:
    statuses: [Starting, Running, Stalled, Blocked, User Action Required, Holding]
    expectedActiveCount: 2
  satisfied-exit-conditions:
    items:
      - provider_identity: backlog/feature-backlog/stalled.md
        status: Stalled
        stalled_exit_satisfied: true
      - provider_identity: backlog/defect-backlog/blocked.md
        status: Blocked
        preventing_cause: unavailable upstream fixture
        blocker_owner: fixture publisher
        unblock_condition: upstream fixture is published
        next_action_owner: dev-backlog-coordinator
        git_state: no candidate changes are pending
        blocker_exit_satisfied: true
    expectedReasons:
      - Stalled disposition requires Coordinator attention
      - Blocked recovery requires Coordinator attention
  blocked-reconciliation-cycle:
    items:
      - provider_identity: provider:quiet-blocked
        status: Blocked
        preventing_cause: external signing service is unavailable
        blocker_owner: signing service operator
        unblock_condition: signed health receipt reports available
        next_action_owner: signing service operator
        dependencies: [signing-service]
        dependency_evidence: [signing-service:unavailable]
        candidate_evidence: [candidate abc123 preserved]
        review_verification_evidence: [review correction attempt 2 retained]
        git_state: branch feature/signing at abc123
        live_claims: [integration-claim:released]
      - provider_identity: provider:exhausted-without-disposition
        status: Blocked
        preventing_cause: review finding remains unresolved
        blocker_owner: dev-backlog-coordinator
        unblock_condition: one concrete disposition is recorded
        next_action_owner: dev-backlog-coordinator
        dependencies: [review-finding-17]
        dependency_evidence: [review-finding-17:open]
        candidate_evidence: [candidate def456 preserved]
        review_verification_evidence: [two correction attempts returned the same finding]
        git_state: branch feature/review at def456
        correction_attempts_exhausted: true
    expectedActionableReasons:
      - correction attempts exhausted without current disposition
    expectedAlertProviders: [provider:exhausted-without-disposition]
  stalled-dispositions:
    sameOwnerResumed:
      same_owner_resumed: true
      active_capacity_count: 9
    sameOwnerResumedAfterRefill:
      same_owner_resumed: true
      active_capacity_count: 10
    ownershipEnded:
      ownership_ended: true
    knownBlocker:
      blocker_cause: upstream credential is unavailable
      blocker_owner: credential provider
      unblock_condition: credential provider restores access
      coordinator_action: verify access restoration and choose the provider transition
    userAction:
      user_owned_action: choose whether to accept the credential rotation
      user_question: Should the credential rotation be accepted?
      unattended_work_boundary: Do not rotate the credential without the user's answer.
    terminalFailure:
      terminal_status: Failed
      terminal_evidence: true
    terminalWithoutEvidence:
      terminal_status: Failed
    insufficientEvidence: {}
