schema: dev-methodology-agent-suite-scenarios
version: 1
suite: dev-orchestrator
scenarios:
  - id: dependency-routing
    priority: 1
    status: executable
    executableCase: fixtures/dependency-routing
    fixtureContract: fixtures/dependency-routing/fixture-contract.yaml
    purpose: Coordinate source and documentation lanes through their proper owners and gates.
    initialState: A source change and operator runbook update require separate clean contributions.
    task: Coordinate implementation, fresh review, verification, integration, and closeout.
    targetSkills: [deliver-work-item, structured-design, structured-explanation]
    taskSelectedAgentDependencies: [dev-documentation-writer, dev-artifact-reviewer]
    requiredDependencyOrder: [dev-coder, dev-code-reviewer, dev-documentation-writer, dev-artifact-reviewer, dev-verifier, dev-merge-coordinator, dev-code-reviewer, dev-artifact-reviewer, dev-verifier, dev-backlog-steward]
    requiredHandoffReceiptLanes: [source, documentation, integration, closeout]
    requiredHandoffReceiptFields: [lane, role, commit, review, verification]
    requiredDeliveryResultFields: [status]
    requiredBehaviors: [Assign bounded lanes, Keep review ownership independent, Verify before and after required integration, "Return one structured Commit result with READY, AWAITING_REVIEW, or BLOCKED", Record Persistence COMPLETED only after Commit READY, Leave Persistence nonterminal after Commit AWAITING_REVIEW or BLOCKED, Verify Persistence closure, Make no agent-claim call or claim evidence when resource coordination is none, Record commits and closeout]
    forbiddenBehaviors: [Implement child work directly, Self-review, Run dependencies concurrently, Skip post-integration gates, Close Persistence before Commit READY, Treat Commit AWAITING_REVIEW or BLOCKED as Persistence COMPLETED, Duplicate the selected manager call]
    deterministicChecks: [harness-agent-identity, dependency-identity-and-order, one-nested-dependency-at-a-time, committed-handoffs, structured-handoff-receipts, post-integration-reviews, output-contract-presence, readiness-consistency]
    expectedOutputs: [status, task breakdown, resolved definition-owned skillsets, assigned agents, handoff plan, integrated verification, committed integration, work-item delivery]
    expectedTerminalStatus: PASS
  - id: bounded-correction
    priority: 2
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Enforce the two-attempt correction boundary and preserve accepted work.
    initialState: A source review repeats the same material finding after two correction attempts.
    task: Coordinate the correction loop and report the terminal state.
    targetSkills: [deliver-work-item, structured-design, structured-explanation, agent-claim]
    allowedAgentDependencies: [dev-coder, dev-code-reviewer, dev-verifier, dev-merge-coordinator, dev-backlog-steward]
    requiredBehaviors: [Return findings to the original owner, Use fresh review contexts, Stop after two failed corrections, Preserve commits and evidence]
    forbiddenBehaviors: [Create a third correction attempt, Approve same-context review, Discard accepted work]
    deterministicChecks: [harness-agent-identity, dependency-identity-and-order, correction-attempt-limit, preserved-handoff-evidence, output-contract-presence]
    expectedOutputs: [status, task breakdown, assigned agents, handoff plan, committed integration, work-item delivery]
    expectedTerminalStatus: BLOCKED
  - id: confirmed-issue-correction
    priority: 3
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Complete the successful correction disposition for an independently confirmed issue.
    initialState: An independent source reviewer confirms one material issue in a clean candidate and returns an evidence-bearing finding.
    task: Return the confirmed issue to the original Dev Coder, obtain the corrected clean candidate, complete fresh independent re-review and reverification, and report READY.
    targetSkills: [deliver-work-item, structured-design, structured-explanation]
    allowedAgentDependencies: [dev-coder, dev-code-reviewer, dev-verifier]
    requiredDependencyOrder: [dev-code-reviewer, dev-coder, dev-code-reviewer, dev-verifier]
    requiredHandoffReceiptLanes: [confirmation, correction, re-review, reverification]
    requiredHandoffReceiptFields: [lane, role, commit, review, verification]
    requiredBehaviors: [Accept the independent reviewer confirmation receipt, Return the confirmed issue to the original producer, Obtain a corrected clean candidate, "Complete correction, fresh re-review, and reverification before closeout", Return READY]
    forbiddenBehaviors: [Treat the original candidate as accepted, Skip fresh re-review, Skip reverification, Warn and close without correction]
    deterministicChecks: [harness-agent-identity, dependency-identity-and-order, one-nested-dependency-at-a-time, committed-handoffs, structured-handoff-receipts, output-contract-presence, readiness-consistency]
    expectedOutputs: [status, task breakdown, assigned agents, handoff plan, integrated verification, committed integration, confirmed issue dispositions, work-item delivery]
    expectedRoleStatus: READY
    expectedTerminalStatus: PASS
  - id: terminal-status-integrity
    priority: 4
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Block completion when a fixed independent dependency is unavailable.
    initialState: A clean source commit exists but dev-code-reviewer cannot be invoked.
    task: Complete the source lane through release readiness.
    targetSkills: [deliver-work-item, structured-design, structured-explanation, agent-claim]
    allowedAgentDependencies: [dev-coder, dev-code-reviewer, dev-verifier, dev-merge-coordinator, dev-backlog-steward]
    requiredBehaviors: [Name the missing dependency, Preserve the clean commit, Leave downstream gates pending, Return BLOCKED]
    forbiddenBehaviors: [Substitute self-review, Invoke verification before review, Report COMPLETED]
    deterministicChecks: [harness-agent-identity, dependency-availability, no-substitution, output-contract-presence, readiness-consistency]
    expectedOutputs: [status, task breakdown, assigned agents, handoff plan, work-item delivery, remaining questions]
    expectedTerminalStatus: BLOCKED
  - id: skill-under-test-defect-routing
    priority: 5
    status: executable
    executableCase: fixtures/skill-under-test-defect-routing
    purpose: Prove that a test orchestrator deliberately excludes a confirmed skill-under-test issue from the current delivery and invokes the configured work-item creation procedure instead of changing the target to make the scenario pass.
    initialState: A frozen synthetic skill under test appears to lack one required behavior, while an independent verifier and a separate file-provider creation boundary are configured.
    task: Preserve the target-under-test bytes and digest, ask Dev Verifier to confirm the issue and return its evidence receipt, deliberately exclude the confirmed issue from the current delivery, then dispatch Dev Backlog Steward to invoke the effective file-provider work-item creation procedure before closeout.
    protectedTarget:
      path: target-skill/SKILL.md
      sha256: 1b5a7a580384ec2eb806c484760ea7e1cec2e94615cb86420d9b118930304138
    allowedMutationPaths: [backlog/defect-backlog/synthetic-target-skill-missing-finding-receipt.md]
    targetSkills: [deliver-work-item, structured-design, structured-explanation]
    allowedAgentDependencies: [dev-verifier, dev-backlog-steward]
    requiredDependencyOrder: [dev-verifier, dev-backlog-steward]
    requiredHandoffReceiptLanes: [confirmation, finding]
    requiredHandoffReceiptFields: [lane, role, commit, review, verification]
    requiredBehaviors: [Preserve the exact skill-under-test bytes and digest, Obtain an independent Dev Verifier confirmation receipt before disposition, Record the missing observable behavior as confirmed failing evidence, Deliberately exclude the confirmed issue from the current delivery, Invoke the effective file-provider work-item creation procedure before closeout, Dispatch Dev Backlog Steward for the configured file backlog write, Return the confirmation and durable finding receipts without claiming the target passed]
    forbiddenBehaviors: [Treat the issue as confirmed without an independent reviewer or verifier receipt, Change the skill under test generated target behavior or expected finding to make the scenario pass, Create a shadow backlog or claim that a source repair was authorized, Suppress or weaken the failing evidence, Warn and close without either disposition]
    deterministicChecks: [harness-agent-identity, dependency-identity-and-order, one-nested-dependency-at-a-time, allowed-paths-only, committed-handoffs, structured-handoff-receipts, output-contract-presence, readiness-consistency]
    expectedOutputs: [status, task breakdown, assigned agents, handoff plan, work-item delivery]
    expectedTerminalStatus: PASS
