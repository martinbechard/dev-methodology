schema: dev-methodology-agent-suite
version: 1
id: dev-orchestrator
priority: 6
target:
  conceptualRole: agents/roles/dev-activities/dev-orchestrator.role.yaml
  nativeAgent: generated/adapters/codex/agents/dev-orchestrator.toml
  repositoryMutation: required
  requiredSkills: [manage-work-items, deliver-work-item, structured-design]
  conditionalSkills:
    create-work-item: A confirmed issue is deliberately excluded and needs a durable provider-owned item.
    coordinate-work-items: The root execution owns a coordinated work item.
    coordinate-codex-tasks: The coordinated root execution runs as a Codex task.
    organise-project-files: Orchestration creates a project file or directory.
    resource-claim: Resource coordination selects resource-claim.
    manage-complex-development-plan: The canonical complexity gate requires an externalized execution plan.
  allowedAgentDependencies: [dev-coder, dev-architect, dev-code-reviewer, dev-verifier, dev-merge-coordinator]
  taskSelectableAgentDependencies: [dev-documentation-writer, dev-artifact-reviewer]
  requiredOutputs: [status, task breakdown, resolved definition-owned skillsets, assigned agents, handoff plan, complex development plan, integrated verification, committed integration, confirmed issue dispositions, work-item delivery]
projectAgents:
  supervisor: agents/supervisor.toml
  judge: agents/judge.toml
projectSkills:
  shared: [../skills/agent-suite-supervision/SKILL.md, ../skills/agent-scenario-design/SKILL.md, ../skills/agent-evidence-judging/SKILL.md]
  suite: [skills/dev-orchestrator-suite-contract/SKILL.md]
execution:
  maximumActiveChildren: 1
  nestedAgentLimit: 1
  nestedAgentConcurrency: 1
  scenarioCatalog: scenarios.yaml
  supervisorInvocation: dev_orchestrator_suite_supervisor
  targetInvocation: dev_orchestrator
  judgeInvocation: dev_orchestrator_suite_judge
  requireCodexIdentityEvidence: true
acceptance:
  deterministicFirst: true
  criticalFailureSkipsJudge: true
  semanticRubric: orchestration-quality
  terminalStatuses: [PASS, FAIL, BLOCKED, STALE]
  dependencyRoutingReceiptFields: [lane, role, commit, review, verification]
