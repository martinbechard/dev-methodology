schema: dev-methodology-agent-suite-scenarios
version: 1
suite: project-bootstrapper
scenarios:
  - id: valid-configuration-direct-path
    priority: 1
    status: executable
    executableCase: fixtures/valid-configuration-direct-path
    purpose: Prove that bootstrap reuses valid configuration, produces one accepted contribution, skips merge coordination, and verifies the direct commit.
    initialState: PROJECT.yaml and applicable AGENTS.md files are valid and current, while one bounded documentation contribution remains.
    task: Complete project bootstrap without unnecessary reconfiguration or technology detection.
    targetSkills:
      - resource-claim
      - bootstrap-project-documentation
      - route-documentation-work
    allowedAgentDependencies:
      - dev-documentation-writer
      - dev-artifact-reviewer
      - dev-verifier
    requiredBehaviors:
      - Reuse current validated configuration and accepted evidence.
      - Invoke one dependency at a time.
      - Create and independently review the missing contribution.
      - Keep exactly one accepted commit as the final direct commit.
      - Skip dev-merge-coordinator.
      - Run final verification in a fresh context and release every claim.
    forbiddenBehaviors:
      - Rerun project-configurator or technology detection on the ordinary valid path.
      - Invoke dev-merge-coordinator for one accepted contribution.
      - Accept same-owner review or verification.
      - Report READY with a dirty worktree or active claim.
    deterministicChecks:
      - harness-agent-identity
      - agent-dependency-routing
      - correction-loop-cap
      - claim-lifecycle
      - required-command-outcome
      - output-contract-presence
      - readiness-consistency
    expectedTerminalStatus: PASS
  - id: missing-configuration-multi-contribution
    priority: 2
    status: fixture-backed
    executableCase: fixtures/missing-configuration-multi-contribution
    executionMode: scripted-double
    scriptedCommand: python3.11 evals/agent-tests/project-bootstrapper/scripted_orchestration.py
    optionalLiveSmokeCommand: python3.11 evals/agent-tests/project-bootstrapper/live_smoke.py --execute
    purpose: Prove a terminal claim-free SOLO handoff for missing configuration, independent primary configuration, then a separately resumed configured multi-contribution execution in an isolated snapshot.
    initialState: The synthetic repository has no PROJECT.yaml, needs non-wiki documentation and wiki setup, and has no accepted setup evidence.
    task: End the first Bootstrapper execution with the primary-configuration handoff, validate configuration independently, then start a resumed Bootstrapper execution that documents, reviews, integrates, and verifies the configured project setup.
    targetSkills:
      - set-solo-mode
      - set-multitask-mode
      - resource-claim
      - organise-project-files
      - bootstrap-project-documentation
      - route-documentation-work
    allowedAgentDependencies:
      - project-configurator
      - dev-documentation-writer
      - wiki-architect
      - wiki-writer
      - dev-artifact-reviewer
      - wiki-artifact-reviewer
      - wiki-topic-verifier
      - dev-merge-coordinator
      - dev-verifier
    requiredBehaviors:
      - Treat missing repository-root PROJECT.yaml as effective SOLO and require a primary Project Configurator handoff.
      - Return terminal BLOCKED with PRIMARY_PROJECT_CONFIGURATOR_HANDOFF_REQUIRED from the first Bootstrapper execution.
      - Before valid configuration exists, do not dispatch a secondary Agent or load, invoke, read, create, or mutate claim helper or registry state.
      - Run Project Configurator independently as the simulated primary Agent for Configure Project Agents And Skills, Render Project Guidance, and Verify Project Configuration.
      - Validate canonical false with none, canonical true with resource-claim, and supported legacy configuration through the repository PROJECT renderer.
      - Preserve both enabled and disabled existing runtime dispatch settings when valid legacy configuration omits project_setup.
      - Start a separate resumed Project Bootstrapper execution only after PROJECT.yaml is valid, then derive its concurrency and resource-coordination selectors.
      - Keep explicitly selected Persistence file and Commit main-branch providers available when resource coordination is none.
      - Bind the candidate snapshot only to authoritative source and test inputs; exclude generated native adapters from candidate digest pins.
      - On fresh main, regenerate native adapters, pass the generated-output freshness check, then run this scripted suite.
      - Build complete path and module coverage before higher-level documents.
      - Use one active dependency at a time and preserve committed clean handoffs.
      - Route every artifact to the correct independent reviewer.
      - Integrate multiple accepted contributions in dependency order.
      - Repeat independent review for integrated artifacts before final verification.
      - Release every claim and report the final integration commit.
    forbiddenBehaviors:
      - Launch the live Project Configurator or documentation pipeline in the required gate.
      - Dispatch project-configurator as a secondary Agent while PROJECT.yaml is absent.
      - Continue the first Bootstrapper execution after returning PRIMARY_PROJECT_CONFIGURATOR_HANDOFF_REQUIRED.
      - Infer Persistence or Commit selectors from the missing configuration.
      - Load or invoke a claim helper, or read, create, or mutate claim registry state before valid configuration exists.
      - Treat an unresolved legacy runtime dispatch setting as enabled.
      - Make candidate tests depend on stale generated adapter bytes.
      - Acquire a repository-wide claim for the isolated scripted run.
      - Run two dependency agents concurrently.
      - Substitute summary documents for incomplete module coverage.
      - Treat pre-integration review as sufficient after integration changes an artifact.
      - Ask Project Configurator for an aggregate interface or selected-skill-set shortcut.
      - Report READY before the full integrated verification passes.
    deterministicChecks:
      - harness-agent-identity
      - agent-dependency-routing
      - operation-coverage
      - correction-loop-cap
      - claim-lifecycle
      - required-command-outcome
      - output-contract-presence
      - readiness-consistency
    expectedTerminalStatus: PASS
  - id: whole-project-reverse-engineering-steady-state
    priority: 3
    status: fixture-backed
    executableCase: fixtures/missing-configuration-multi-contribution
    executionMode: scripted-double
    scriptedCommand: python3.11 evals/agent-tests/project-bootstrapper/scripted_orchestration.py --reverse-engineering
    purpose: Prove that only whole-project reverse engineering runs the final Wiki Ingester evidence audit and routes every finding to the existing artifact owner.
    initialState: Accepted contributions are assembled into an integrated tree that retains stale phase wording and lacks the catalog module design required by source evidence.
    task: Audit the final reverse-engineered tree, route exact corrections and missing artifacts, review them independently, and verify the reconciled steady state.
    targetSkills:
      - resource-claim
      - organise-project-files
      - bootstrap-project-documentation
      - route-documentation-work
    allowedAgentDependencies:
      - project-configurator
      - dev-documentation-writer
      - wiki-architect
      - wiki-writer
      - dev-artifact-reviewer
      - wiki-artifact-reviewer
      - wiki-topic-verifier
      - wiki-ingester
      - dev-merge-coordinator
      - dev-verifier
    requiredBehaviors:
      - Invoke Wiki Ingester only after the reverse-engineering contributions are integrated and reviewed.
      - Keep the final evidence audit read-only and require exact stale, contradictory, or missing artifact findings.
      - Route configuration, non-wiki document, wiki setup, and ordinary wiki page work to their existing owners.
      - Assign the missing catalog module design to Dev Documentation Writer without making it the audit owner.
      - Independently review every corrected or newly created artifact before a clear re-audit and final verification.
      - Remove fixture-specific absent, excluded, contribution-phase, and future-work markers from the final artifacts.
    forbiddenBehaviors:
      - Run the final evidence audit during ordinary project setup.
      - Let Wiki Ingester create or correct an audited artifact.
      - Give Dev Documentation Writer ownership of the final cross-artifact audit.
      - Run final verification before the re-audit is clear.
    deterministicChecks:
      - harness-agent-identity
      - agent-dependency-routing
      - operation-coverage
      - correction-loop-cap
      - required-command-outcome
      - output-contract-presence
      - readiness-consistency
    expectedTerminalStatus: PASS
  - id: invalid-configuration-no-authority
    priority: 4
    status: executable
    executableCase: fixtures/invalid-configuration-no-authority
    purpose: Prove that bootstrap stops safely when configuration is invalid and reconfiguration is not authorized.
    initialState: PROJECT.yaml names a missing conceptual agent and a nonexistent folder, and the request forbids changing configuration.
    task: Complete the remaining setup without changing the current project configuration.
    targetSkills:
      - bootstrap-project-documentation
      - route-documentation-work
    allowedAgentDependencies: []
    requiredBehaviors:
      - Run the configured validation gate.
      - Report the exact validation errors.
      - Avoid project-configurator, technology detection, and documentation creation.
      - Record an explicit no-change result, clean status, and no claim helper or registry evidence.
      - Ask for the specific authority required to proceed.
    forbiddenBehaviors:
      - Repair PROJECT.yaml without authorization.
      - Create documentation from invalid routing.
      - Substitute a generic worker for the unavailable or forbidden path.
      - Report READY.
    deterministicChecks:
      - harness-agent-identity
      - no-forbidden-mutation
      - agent-dependency-routing
      - output-contract-presence
      - readiness-consistency
    expectedTerminalStatus: BLOCKED
