schema: dev-methodology-agent-suite-scenarios
version: 1
suite: project-configurator
scenarios:
  - id: valid-configuration-reuse
    priority: 1
    status: executable
    executableCase: fixtures/valid-configuration-reuse
    purpose: Reuse valid project routing while replacing only stale evidence.
    initialState: PROJECT.yaml and nested guidance exist; one worker path moved but runtime capabilities remain available.
    task: Reconcile and validate the existing configuration.
    targetSkills: [resource-claim, detect-technology-skills, create-project-configuration, route-documentation-work, verify-documentation-page, python]
    allowedAgentDependencies: []
    requiredBehaviors:
      - Inspect representative scopes
      - Preserve valid routing
      - Prove the worker-old to worker move from frozen TASK.md and README.md
      - Keep protected evidence inputs unchanged
      - Preserve each structured detector sourceEvidence row and its scalar-string evidence list
      - Keep generated AGENTS.md evidence plain and source-faithful
      - Validate every definition skill and bridge
    forbiddenBehaviors:
      - Replace the configuration wholesale
      - Change TASK.md, README.md, available-skills.txt, worker/main.py, or worker/test_main.py
      - Flatten a structured sourceEvidence row to a scalar path
      - Use a non-string value inside a sourceEvidence row evidence list
      - Add generated guidance claims that are absent from authoritative fixture sources
      - Copy generic claim procedure
      - Invent unavailable skills
    deterministicChecks:
      - harness-agent-identity
      - claim-lifecycle
      - allowed-paths-only
      - authoritative-move-provenance
      - protected-input-digests
      - configuration-schema
      - structured-source-evidence-fidelity
      - scalar-detection-evidence
      - source-faithful-guidance
      - reference-validation
      - output-contract-presence
    expectedOutputs: [PROJECT.yaml, technology detection skillsets, nested AGENTS.md recommendations, runtime capability validation, AGENTS.md and CLAUDE.md routing, validation evidence]
    expectedTerminalStatus: PASS
  - id: technology-routing
    priority: 2
    status: executable
    executableCase: fixtures/technology-routing
    purpose: Route distinct folder technologies from source evidence and record no-variant explicitly.
    initialState: The fixture contains Python service, TypeScript UI, an unsupported infrastructure dialect, and the required ignored-worktree prerequisite.
    task: Create folder-specific skillsets and deterministic nested guidance.
    targetSkills: [resource-claim, detect-technology-skills, create-project-configuration, route-documentation-work, bootstrap-project-documentation, verify-documentation-page, python, typescript]
    allowedAgentDependencies: []
    requiredBehaviors:
      - Invoke Detect Technology Skills from representative evidence
      - Compare with runtime-exposed skills
      - Record NO_VARIANT for unsupported scope
      - Invoke Configure Project Agents And Skills for the single root PROJECT.yaml
      - Invoke Render Project Guidance for root and nested routing
      - Invoke Verify Project Configuration before handoff
      - Write every root and nested Claude bridge as the exact functional import of its colocated AGENTS.md
      - Preserve the canonical project template structure and every mandatory section
      - Select and validate the required conceptual definitions
      - Preserve the Project Configurator fixed and conditional skill sets without omissions, duplicates, or reclassification
      - Evaluate mutation and claim agreement for every selected definition
    forbiddenBehaviors: [Skip the unsupported scope, Flatten distinct scopes, Declare a nonexistent variant, Replace a functional Claude import with descriptive prose, Omit duplicate or reclassify a canonical Project Configurator skill, Treat confirmed technology skills as an aggregate interface, Use a selected-skill-set shortcut]
    deterministicChecks: [harness-agent-identity, claim-lifecycle, configuration-schema, mandatory-project-sections, conceptual-definition-validation, canonical-role-skill-ownership, mutation-claim-consistency, detection-evidence, no-variant-record, functional-claude-bridges, routing-reference-validation, output-contract-presence]
    expectedOutputs: [PROJECT.yaml, technology detection skillsets, nested AGENTS.md recommendations, runtime capability validation, AGENTS.md and CLAUDE.md routing, validation evidence]
    expectedTerminalStatus: PASS
  - id: invalid-configuration
    priority: 3
    status: executable
    executableCase: fixtures/invalid-configuration
    purpose: Reject a required unavailable skill and mutation/claim mismatch.
    initialState: A proposed role mutates the repository without claim support and references an unavailable required technology skill.
    task: Validate the configuration and report whether it is usable.
    targetSkills: [resource-claim, detect-technology-skills, create-project-configuration, route-documentation-work, verify-documentation-page]
    allowedAgentDependencies: []
    requiredBehaviors:
      - Inspect PROJECT.yaml, proposed-role.yaml, and available-skills.txt directly
      - Identify both invalid contracts
      - Keep unavailable required skill BLOCKED
      - Avoid emitting accepted routing
      - Distinguish target-owned reasoning from supervisor assertions
    forbiddenBehaviors: [Downgrade required skill to NO_VARIANT, Copy a claim skill into project guidance, Report configuration valid]
    deterministicChecks: [harness-agent-identity, target-repository-inspection, independent-target-reasoning, mutation-claim-consistency, runtime-capability-validation, no-forbidden-routing, output-contract-presence]
    expectedOutputs: [runtime capability validation, validation evidence]
    expectedTerminalStatus: BLOCKED
