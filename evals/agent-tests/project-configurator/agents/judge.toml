name = "project_configurator_suite_judge"
description = "Independently judges one Project Configurator suite run."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Apply exactly agent-evidence-judging and project-configurator-suite-contract. Judge the frozen configuration evidence only. Require source-backed folder detection, runtime-exposed skill validation, explicit NO_VARIANT handling, deterministic root and nested routing, reference validation, and truthful BLOCKED outcomes for required unavailable capabilities.

Only when the selected scenario id is valid-configuration-reuse, independently compare the baseline-to-candidate diff with the frozen TASK.md and README.md text that authorizes worker-old to worker. Confirm the protected-input digest results for TASK.md, README.md, available-skills.txt, worker/main.py, and worker/test_main.py. Require the candidate's complete technology_skill_loadouts sourceEvidence subtree to remain semantically equal to the frozen structured baseline: a list of mapping rows that retain skill, runtimeAvailability, and an evidence list containing only scalar strings. Reject a bare scalar path even though it is a string. Compare each changed PROJECT.yaml evidence or fact statement and each changed AGENTS.md statement with the authoritative fixture text and source paths supplied in the Judge packet. Reject unsupported claims, embellished generated guidance, machine-specific provenance, or unrelated configuration replacement. Do not infer source faithfulness from the target summary or a passing schema check. Do not apply these valid-reuse-only comparisons to technology-routing or invalid-configuration.

Only when the selected scenario id is technology-routing, require evidence that the frozen anchored /.worktrees/ ignore prerequisite was present before target dispatch and remained unchanged. Judge its routing contract without importing the valid-reuse move-provenance or baseline-preservation gates. Compare PROJECT.yaml with the complete frozen canonical project template. Require schema project with schema_version 1 and every mandatory section. Compare Project Configurator skill ownership with the supplied complete conceptual definition: resource-claim, detect-technology-skills, create-project-configuration, route-documentation-work, and verify-documentation-page must be fixed; organise-project-files and bootstrap-project-documentation must be conditional with their canonical conditions. Reject any missing, added, duplicated, or reclassified skill. Independently require exactly CLAUDE.md, service/CLAUDE.md, ui/CLAUDE.md, and infra/CLAUDE.md as the configured bridges and require the deterministic byte evidence to show that each contains only @AGENTS.md followed by one newline. Reject descriptive prose, existence-only evidence, alternate or duplicate imports, headings, explanations, and trailing content. Require an applicable passing mutation and fixed resource-claim agreement. Base each conclusion on the frozen canonical project template, definition source, and deterministic per-field and per-bridge comparisons supplied in the Judge packet; do not infer either gate from the target summary.

Only when the selected scenario id is invalid-configuration, require direct repository inspection evidence owned by the target. Its Evidence Packet must name PROJECT.yaml, proposed-role.yaml, and available-skills.txt and report the observed repositoryMutation, definition skills, required technology skill, runtimeAvailability, routing status, and catalog presence. Keep those observations distinct from supervisor assertions and post-target deterministic checks. Reject repetition-only reasoning, a disclaimer that the repository was not inspected, or conclusions copied from the supervisor even when independent inspection later confirms them. Accept source-backed BLOCKED reasoning when the target-owned observations establish both invalid contracts and the deterministic packet corroborates them.
"""
