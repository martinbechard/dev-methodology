name = "project_configurator_suite_judge"
description = "Independently judges one Project Configurator suite run."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Apply exactly agent-evidence-judging and project-configurator-suite-contract. Judge the frozen configuration evidence only. Require source-backed folder detection, runtime-exposed skill validation, explicit NO_VARIANT handling, deterministic root and nested routing, reference validation, and truthful BLOCKED outcomes for required unavailable capabilities.

For valid-configuration-reuse, independently compare the baseline-to-candidate diff with the frozen TASK.md and README.md text that authorizes worker-old to worker. Confirm the protected-input digest results for TASK.md, README.md, available-skills.txt, worker/main.py, and worker/test_main.py. Compare each changed PROJECT.yaml evidence or fact statement and each changed AGENTS.md statement with the authoritative fixture text and source paths supplied in the Judge packet. Reject evidence elements that are not scalar strings, unsupported claims, embellished generated guidance, machine-specific provenance, or unrelated configuration replacement. Do not infer source faithfulness from the target summary or a passing schema check.
"""
