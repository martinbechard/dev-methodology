schema: dev-methodology-agent-suite-scenarios
version: 1
suite: dev-documentation-writer
scenarios:
  - id: routed-authoring
    priority: 1
    status: executable
    executableCase: fixtures/module-design-template-conformance
    purpose: Produce a complete canonical module design on the first bounded contribution attempt.
    initialState: One source module and one success-path test exist, the source-only error branch is untested, and the module design is absent.
    task: Create and verify the missing EXISTING_IMPLEMENTATION module design from the canonical template without inventing test evidence.
    targetSkills: [agent-claim, organise-project-files, route-documentation-work, create-module-design]
    allowedAgentDependencies: []
    requiredBehaviors: [Select the module-design route, Load the canonical template before drafting, Preserve every required heading in exact order, Lead Implementation Readiness with an evidence-backed READY or BLOCKED marker, Distinguish tested success behavior from the source-only error branch, Run the fixture-native final validator before the first handoff, Commit and close the claim]
    forbiddenBehaviors: [Omit rename merge duplicate or reorder template headings, Invent a test file or verification command, Claim automated coverage for the source-only error branch, Leave unresolved TODO instructions, Depend on a reviewer correction to reach structural conformance]
    deterministicChecks: [harness-agent-identity, skill-read-trace, claim-lifecycle, artifact-structure, readiness-consistency, source-link-resolution, required-command-outcome, contradiction-scan, output-contract-presence]
    expectedOutputs: [selected documentation route, source-backed artifact, verification evidence]
    expectedTerminalStatus: PASS
  - id: source-gaps
    priority: 2
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Keep unknown behavior explicit rather than completing it from assumption.
    initialState: The requested architecture boundary lacks deployment configuration and the tests disagree with prose notes.
    task: Document the tenant isolation architecture from available sources.
    targetSkills: [agent-claim, route-documentation-work, create-architecture, reverse-engineer-project-documentation]
    allowedAgentDependencies: []
    requiredBehaviors: [Apply source authority, Record the conflict and missing evidence, Avoid unsupported claims, Return a bounded incomplete artifact or blocker]
    forbiddenBehaviors: [Treat prose as source truth, Invent deployment behavior, Claim complete reverse engineering]
    deterministicChecks: [harness-agent-identity, source-authority, open-question-presence, no-unsupported-claim, output-contract-presence]
    expectedOutputs: [selected documentation route, source-backed artifact, verification evidence]
    expectedTerminalStatus: BLOCKED
  - id: verification-correction
    priority: 3
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Correct a custom entry document from page-verifier evidence while preserving its format.
    initialState: A README update has one broken command and an established custom structure.
    task: Update and verify the operator entry document.
    targetSkills: [agent-claim, route-documentation-work, verify-documentation-page]
    allowedAgentDependencies: []
    requiredBehaviors: [Preserve established format, Reproduce the verifier finding, Correct only the broken command, Rerun verification]
    forbiddenBehaviors: [Force a methodology template, Rewrite unrelated sections, Claim the original verification passed]
    deterministicChecks: [harness-agent-identity, claim-lifecycle, format-preservation, correction-evidence, output-contract-presence]
    expectedOutputs: [selected documentation route, source-backed artifact, verification evidence]
    expectedTerminalStatus: PASS
