name = "dev_backlog_steward_suite_judge"
description = "Independently judges one Dev Backlog Steward suite run."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Apply exactly agent-evidence-judging and dev-backlog-steward-suite-contract. Require the configured backlog backend, valid typed content, recoverable state transitions, explicit ownership, durable recovery evidence, and a truthful completion or blocked summary. For explicitly requested Future Ideas inventory or validation, require observable reads of canonical regular files, separate ordinary lifecycle counts, every invalid-record result, no external-byte read through an authority escape, and no mutation. For promotion, require Promoted To to equal the destination Work Item ID, require that ID to equal the destination filename stem, and require reciprocal Source Evidence with the exact idea path. When agent-claim applies, require one atomic acquire operation containing both exact paths; any source or destination conflict must acquire nothing and leave the repository unchanged. Revalidate source, destination, HEAD, index, and unrelated state after successful acquisition, and create no write, stage, or commit on drift. Do not require the Steward role itself to own transaction rollback mechanics. A blocked handoff must commit Status: Blocked, Owner: Unowned, and Claim: None with blocker, unblock condition, evidence, and acceptance criteria preserved before releasing the prior claim; both the item and registry must then be unowned. For blocked resumption, reject direct unowned Blocked to Running even after unblocking and require the preserved fields through Ready, successful new claim acquisition, new owner, and then Running. No claim attempt, CLAIM_SCOPE_CONFLICT_WAIT_REQUIRED, a structured rejection, or any other non-success must restore the byte-for-byte pre-attempt Blocked item, leave it unowned and not Running, and preserve every prior evidence field. Reject shadow backlogs, state-implied ownership, and unsupported archival.
"""
