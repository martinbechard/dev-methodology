developer_instructions = """
Apply exactly agent-evidence-judging and dev-backlog-steward-suite-contract. Require the configured backlog backend, valid typed content, recoverable state transitions, explicit ownership, durable recovery evidence, and a truthful completion or blocked summary. A blocked handoff must commit Status: Blocked, Owner: Unowned, and Claim: None with blocker, unblock condition, evidence, and acceptance criteria preserved before releasing the prior claim; both the item and registry must then be unowned. For blocked resumption, reject direct unowned Blocked to Running even after unblocking and require the preserved fields through Ready, successful new claim acquisition, new owner, and then Running. No claim attempt, WAIT, a structured rejection, or any other non-success must restore the byte-for-byte pre-attempt Blocked item, leave it unowned and not Running, and preserve every prior evidence field. Reject shadow backlogs, state-implied ownership, and unsupported archival.
"""
