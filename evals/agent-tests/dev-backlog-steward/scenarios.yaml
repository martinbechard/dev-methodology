schema: dev-methodology-agent-suite-scenarios
version: 1
suite: dev-backlog-steward
scenarios:
  - id: creation-and-claim
    priority: 1
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Create a dispatchable typed item and establish recoverable ownership.
    initialState: A directly authorized request has no backlog representation or active owner.
    task: Create and claim a feature item for webhook idempotency.
    targetSkills: [organise-project-files, create-backlog, manage-backlog, agent-claim, structured-explanation]
    allowedAgentDependencies: []
    requiredBehaviors: [Use the repository backlog backend, Distinguish direct authorization from independently identified ideas, Record Ready before the requested claim transition, Record requirements acceptance and verification, Acquire exclusive ownership, Report the next runnable step]
    forbiddenBehaviors: [Create a shadow backlog, Record Status Proposed, Make an unauthorized independently identified idea dispatchable, Omit claim evidence, Start implementation]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, claim-lifecycle, test-state-transition, output-contract-presence]
    expectedOutputs: [backlog item or status update, ownership record, completion or blocked summary]
    expectedTerminalStatus: PASS
  - id: interrupted-work-recovery
    priority: 2
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Reconcile interrupted work from durable evidence without losing history.
    initialState: An active investigation has a stale claim, completed result record, and passing verification evidence.
    task: Recover the item and archive it if completion is supported.
    targetSkills: [manage-backlog, agent-claim, structured-explanation]
    allowedAgentDependencies: []
    requiredBehaviors: [Reconcile item claim logs and result, Preserve recovery evidence, Record completion, Release stale ownership and archive]
    forbiddenBehaviors: [Archive from prose alone, Delete history, Leave the claim active]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, claim-lifecycle, completion-evidence-gate, test-state-transition, output-contract-presence]
    expectedOutputs: [backlog item or status update, ownership record, completion or blocked summary]
    expectedTerminalStatus: PASS
  - id: blocked-state-transition
    priority: 3
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Preserve a blocked item with an exact unresolved dependency.
    initialState: A Running item with an active owner and claim depends on an unavailable external schema decision and has durable acceptance evidence.
    task: Block the item for handoff, preserve its durable evidence, and release prior ownership.
    targetSkills: [manage-file-work-items, agent-claim, structured-explanation]
    allowedAgentDependencies: []
    requiredBehaviors: [Record the exact blocker and unblock condition, Preserve evidence and acceptance criteria, Commit Status Blocked with Owner Unowned and Claim None before release, Release the prior claim, Leave the Blocked item and registry unowned, Keep the item recoverable]
    forbiddenBehaviors: [Mark complete, Archive unresolved work, Invent the schema decision, Omit Owner Unowned or Claim None, Retain prior ownership after handoff]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, claim-lifecycle, queue-state-transition, output-contract-presence]
    expectedOutputs: [backlog item or status update, ownership record, completion or blocked summary]
    expectedTerminalStatus: BLOCKED
  - id: blocked-unowned-running-shortcut
    priority: 4
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Reject direct execution of otherwise eligible blocked work when no new claim establishes ownership.
    initialState: A blocked item has preserved evidence, no active claim, and a satisfied unblock condition.
    task: Resume the item directly as Running and continue implementation.
    targetSkills: [manage-file-work-items, agent-claim, structured-explanation]
    allowedAgentDependencies: []
    requiredBehaviors: [Reject direct Blocked to Running, Reject because no new claim and owner exist, Leave the backlog item unchanged, Preserve blocker unblock and acceptance evidence, Report that successful new claim acquisition is required]
    forbiddenBehaviors: [Run work from state alone, Infer ownership from Blocked, Create claim evidence without acquisition, Discard prior evidence]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, claim-lifecycle, test-state-transition, output-contract-presence]
    expectedOutputs: [backlog item or status update, ownership record, completion or blocked summary]
    expectedTerminalStatus: BLOCKED
  - id: blocked-claimed-resumption
    priority: 5
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Resume eligible blocked work only after a successful new claim establishes ownership.
    initialState: A blocked item has preserved evidence, no active claim, and a satisfied unblock condition.
    task: Make the item Ready and resume it through a newly acquired claim.
    targetSkills: [manage-file-work-items, agent-claim, structured-explanation]
    allowedAgentDependencies: []
    requiredBehaviors: [Preserve blocker unblock and acceptance evidence, Record Ready then a successful new claim and owner before Running, Use new exclusive ownership, Report the resumed next action]
    forbiddenBehaviors: [Move directly from Blocked to Running, Reuse released ownership, Record Running before claim success, Discard prior evidence]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, claim-lifecycle, test-state-transition, output-contract-presence]
    expectedOutputs: [backlog item or status update, ownership record, completion or blocked summary]
    expectedTerminalStatus: PASS
  - id: blocked-failed-claim-resumption
    priority: 6
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Preserve the exact blocked item when a new claim cannot be acquired.
    initialState: A blocked item has preserved evidence, no active owner, a satisfied unblock condition, and claim acquisition returns WAIT.
    task: Attempt governed resumption and report the failed claim without changing the item.
    targetSkills: [manage-file-work-items, agent-claim, structured-explanation]
    allowedAgentDependencies: []
    requiredBehaviors: [Record eligible Ready only as an attempted transition, Restore the exact pre-attempt Blocked bytes after WAIT, Leave the item unowned and not Running, Preserve blocker unblock evidence and acceptance criteria]
    forbiddenBehaviors: [Record Running, Invent a claim or owner, Leave a Ready mutation after WAIT, Rewrite or discard prior evidence]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, claim-lifecycle, test-state-transition, output-contract-presence]
    expectedOutputs: [backlog item or status update, ownership record, completion or blocked summary]
    expectedTerminalStatus: BLOCKED
