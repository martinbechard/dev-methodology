schema: dev-methodology-agent-suite-scenarios
version: 1
suite: dev-backlog-steward
scenarios:
  - id: creation-and-claim
    priority: 1
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Create a dispatchable typed item; this row declares project-selected resource coordination variants and does not claim both variants were executed.
    initialState: A directly authorized request has no backlog representation or active provider owner.
    task: Create a feature item for webhook idempotency and establish provider-selected ownership.
    targetSkills: [organise-project-files, create-work-item-file, manage-file-work-items, structured-explanation]
    allowedAgentDependencies: []
    resourceCoordinationCases:
      agent-claim:
        targetSkills: [agent-claim]
        deterministicChecks: [claim-lifecycle]
        claimCalls: [Acquire exclusive ownership before the provider ownership transition]
        registryMutations: [Record the active ownership]
        journalWrites: [Record the successful acquisition]
        claimReleases: []
        claimEvidence: required
        claimLifecycle: [Acquire exclusive ownership before the ownership transition, Retain the active ownership for the implementation handoff]
        providerLifecycle: Create the same item, record Ready, record provider-selected ownership, and report the next runnable step.
      none:
        targetSkills: []
        deterministicChecks: []
        claimCalls: []
        registryMutations: []
        journalWrites: []
        claimReleases: []
        claimEvidence: absent
        providerLifecycle: Create the same item, record Ready, record provider-selected ownership, and report the next runnable step.
    requiredBehaviors: [Use the repository backlog backend, Distinguish direct authorization from independently identified ideas, Record Ready before the provider ownership transition, Record requirements acceptance and verification, Report the next runnable step]
    forbiddenBehaviors: [Create a shadow backlog, Record Status Proposed, Make an unauthorized independently identified idea dispatchable, Start implementation]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, test-state-transition, output-contract-presence]
    expectedOutputs: ["backlog item, Future Idea, or status update", ownership record, completion or blocked summary]
    expectedTerminalStatus: PASS
