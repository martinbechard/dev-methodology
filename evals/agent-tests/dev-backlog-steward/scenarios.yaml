        claimCalls: [Confirm that no new ownership was acquired]
        registryMutations: [Leave the registry unchanged]
        journalWrites: [Record the rejected ownership prerequisite when applicable]
        claimReleases: []
        claimEvidence: required
        claimLifecycle: [Require successful new acquisition before Running, Leave the item unchanged when no ownership was acquired]
        providerLifecycle: Reject direct Blocked to Running without provider ownership, leave the item unchanged, preserve prior evidence, and report the ownership prerequisite.
      none:
        targetSkills: []
        deterministicChecks: []
        claimCalls: []
        registryMutations: []
        journalWrites: []
        claimReleases: []
        claimEvidence: absent
