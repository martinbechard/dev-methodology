  - id: future-ideas-capture-and-promotion
    priority: 7
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Capture and promote a Future Idea; this row declares project-selected resource coordination variants and does not claim both variants were executed.
    initialState: The file provider applies and the user explicitly requests idea capture but has not authorized implementation; a later explicit direction authorizes promotion. A non-file provider variant has no one-item file override.
    task: Capture the retry-dashboard thought as a Future Idea, then promote it into complete typed work while retaining the source idea.
    targetSkills: [organise-project-files, create-work-item-file, manage-file-work-items, structured-explanation]
    allowedAgentDependencies: []
    resourceCoordinationCases:
      agent-claim:
        targetSkills: [agent-claim]
        deterministicChecks: [claim-lifecycle]
        claimCalls: [Acquire exclusive ownership before promotion mutation]
        registryMutations: [Record acquisition and a safe terminal release or retained interrupted ownership]
        journalWrites: [Record acquisition and the resulting ownership lifecycle]
        claimReleases: [Release ownership after success or safe verified rollback]
        claimEvidence: required
        claimLifecycle: [Acquire before promotion mutation, Retain ownership after unsafe rollback or postcommit verification failure, Release after success or safe verified rollback]
        providerLifecycle: Capture the lightweight idea, promote it through a failure-atomic transaction with reciprocal provenance, preserve unrelated staged state, and retain the source idea.
      none:
        targetSkills: []
        deterministicChecks: []
        claimCalls: []
        registryMutations: []
        journalWrites: []
        claimReleases: []
        claimEvidence: absent
        providerLifecycle: Capture the lightweight idea, promote it through a failure-atomic transaction with reciprocal provenance, preserve unrelated staged state, and retain the source idea.
    requiredBehaviors: [Route ordinary work through the effective Persistence-selected backend, Require the file provider or an explicit one-item file override for Future Ideas, Block non-file capture without creating an issue or shadow file, Require only title synopsis and origin or rationale, Keep optional notes and a free-text revisit trigger, Exclude the idea from ordinary inventory runnable unattended dispatch and lifecycle, Keep Holding as recognized deferred work, Retain the original idea after promotion, Add Promoted To on the idea and reciprocal Source Evidence on the complete typed work item, Require Completion to be direct-main feature-branch or UNSET, Require Open Questions on promoted work, Preflight target collisions before any promotion write, Snapshot exact idea bytes target bytes and target existence, Snapshot exact full Git index file bytes and existence before mutation, Stage and path-limit commit to exactly the idea and target while preserving unrelated staged state, Capture the new commit OID and verify that exact object contains exactly the reciprocal idea and target pair, Restore exact pre-attempt state after target-write idea-write validation staging or commit failure, Restore and verify exact pre-attempt index bytes and existence on failure, Return the Future Idea output contract]
    forbiddenBehaviors: [Create a GitHub issue for a Future Idea, Create a shadow Future Idea file under a non-file provider, Require Status Owner Dependencies Acceptance Criteria or Verification for capture, Treat the revisit trigger as a schedule, Count the idea as Holding, Dispatch the idea before promotion, Remove the source idea during promotion, Return only the retired backlog item or status update contract]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, queue-state-transition, output-contract-presence]
    expectedOutputs: ["backlog item, Future Idea, or status update", ownership record, completion or blocked summary]
    expectedTerminalStatus: PASS
