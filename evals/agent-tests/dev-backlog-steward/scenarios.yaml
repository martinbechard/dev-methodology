    initialState: An active investigation has a completed result record and passing verification evidence.
    task: Reconcile the result and archive the item if completion is supported.
    targetSkills: [manage-file-work-items, structured-explanation]
    allowedAgentDependencies: []
    resourceCoordinationCases:
      agent-claim:
        targetSkills: [agent-claim]
        deterministicChecks: [claim-lifecycle]
        claimCalls: [Read and reconcile existing ownership]
        registryMutations: [Clear stale ownership after committed completion]
        journalWrites: [Record ownership reconciliation and release]
        claimReleases: [Release stale ownership only after completion is committed]
        claimEvidence: required
        claimLifecycle: [Reconcile registry evidence, Release stale ownership only after completion is committed]
        providerLifecycle: Reconcile the same result and verification evidence, record completion, archive the item, and clear provider ownership.
      none:
        targetSkills: []
        deterministicChecks: []
        claimCalls: []
        registryMutations: []
        journalWrites: []
        claimReleases: []
        claimEvidence: absent
        providerLifecycle: Reconcile the same result and verification evidence, record completion, archive the item, and clear provider ownership.
    requiredBehaviors: [Reconcile durable item and result evidence, Preserve recovery evidence, Record completion, Archive only after completion is supported, Clear provider ownership]
    forbiddenBehaviors: [Archive from prose alone, Delete history, Leave stale provider ownership active]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, completion-evidence-gate, test-state-transition, output-contract-presence]
    expectedOutputs: ["backlog item, Future Idea, or status update", ownership record, completion or blocked summary]
    expectedTerminalStatus: PASS
