    purpose: Preserve a blocked item; this row declares project-selected resource coordination variants and does not claim both variants were executed.
    initialState: A Running item with an active provider owner depends on an unavailable external schema decision and has durable acceptance evidence.
    task: Block the item for handoff, preserve its durable evidence, and clear prior provider ownership.
    targetSkills: [manage-file-work-items, structured-explanation]
    allowedAgentDependencies: []
    resourceCoordinationCases:
      agent-claim:
        targetSkills: [agent-claim]
        deterministicChecks: [claim-lifecycle]
        claimCalls: [Read the active ownership before the blocked transition]
        registryMutations: [Clear ownership after the Blocked and unowned item state is committed]
        journalWrites: [Record the normal ownership release]
        claimReleases: [Release prior ownership after the Blocked and unowned item state is committed]
        claimEvidence: required
        claimLifecycle: [Commit Blocked and unowned item state before releasing prior ownership, Leave the registry unowned]
        providerLifecycle: Record the exact blocker and unblock condition, preserve evidence, commit Blocked with Owner Unowned, and keep the item recoverable.
      none:
        targetSkills: []
        deterministicChecks: []
        claimCalls: []
        registryMutations: []
        journalWrites: []
        claimReleases: []
        claimEvidence: absent
        providerLifecycle: Record the exact blocker and unblock condition, preserve evidence, commit Blocked with Owner Unowned, and keep the item recoverable.
    requiredBehaviors: [Record the exact blocker and unblock condition, Preserve evidence and acceptance criteria, Commit Status Blocked with Owner Unowned, Leave the Blocked item unowned, Keep the item recoverable]
    forbiddenBehaviors: [Mark complete, Archive unresolved work, Invent the schema decision, Omit Owner Unowned, Retain prior provider ownership after handoff]
    deterministicChecks: [harness-agent-identity, artifact-structure, project-hash-policy, queue-state-transition, output-contract-presence]
    expectedOutputs: ["backlog item, Future Idea, or status update", ownership record, completion or blocked summary]
    expectedTerminalStatus: BLOCKED
