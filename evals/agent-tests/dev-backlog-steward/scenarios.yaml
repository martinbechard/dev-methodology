      agent-claim:
        targetSkills: [agent-claim]
        deterministicChecks: [claim-lifecycle]
        claimCalls: [Attempt new exclusive ownership acquisition]
        registryMutations: [Leave the registry unchanged after the rejected acquisition]
        journalWrites: [Record the rejected acquisition outcome]
        claimReleases: []
        claimEvidence: required
        claimLifecycle: [Attempt new ownership acquisition, Restore exact pre-attempt bytes after CLAIM_SCOPE_CONFLICT_WAIT_REQUIRED]
        providerLifecycle: Attempt Ready, restore exact pre-attempt bytes when provider ownership cannot be established, leave the item unowned and not Running, and preserve prior evidence.
      none:
        targetSkills: []
        deterministicChecks: []
        claimCalls: []
        registryMutations: []
        journalWrites: []
        claimReleases: []
        claimEvidence: absent
