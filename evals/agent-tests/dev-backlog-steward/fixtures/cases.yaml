schema: synthetic-agent-suite-cases
cases:
  creation-and-claim: {backend: files, request: webhook idempotency keys, initialStatus: absent}
  interrupted-work-recovery: {status: active, claim: stale, result: complete, verification: pass}
  blocked-state-transition:
    status: running
    owner: dev-coder
    claim: schema-migration-active
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    itemBefore: |
      # Schema Migration
      Status: Running
      Owner: dev-coder
      Claim: schema-migration-active
      Blocker: External schema decision is unavailable.
      Unblock Condition: Approved schema decision is recorded.
      Evidence: Existing schema analysis and verification log.
      Acceptance Criteria: Schema decision remains traceable; existing verification remains required.
  blocked-unowned-running-shortcut:
    status: blocked
    claim: null
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    unblockConditionSatisfied: true
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    claimOutcome: NOT_ATTEMPTED
    attemptedTransition: running
    itemBefore: &blocked-resumption-item |
      # Schema Migration
      Status: Blocked
      Owner: Unowned
      Claim: None
      Blocker: External schema decision is unavailable.
      Unblock Condition: Approved schema decision is recorded.
      Evidence: Existing schema analysis and verification log.
      Acceptance Criteria: Schema decision remains traceable; existing verification remains required.
  blocked-claimed-resumption:
    status: blocked
    claim: null
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    unblockConditionSatisfied: true
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    claimOutcome: SHARED_CHECKOUT_ACQUIRED
    newOwner: dev-coder
    newClaim: schema-migration-resumption
    requiredTransitions: [ready, claimed, running]
    itemBefore: *blocked-resumption-item
  blocked-failed-claim-resumption:
    status: blocked
    claim: null
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    unblockConditionSatisfied: true
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    claimOutcome: CLAIM_SCOPE_CONFLICT_WAIT_REQUIRED
    otherFailedClaimOutcomes: [INVALID_SCOPE, DIRTY_CHECKOUT_RECOVERY_AUTHORIZATION_REQUIRED]
    requiredResult: byte-for-byte unchanged
    itemBefore: *blocked-resumption-item
  future-ideas-capture-and-promotion:
    provider: file
    nonFileProviderWithoutOverride: github
    nonFileProviderResult: BLOCKED with no issue and no shadow file
    explicitFileOverrideResult: capture under backlog/future-ideas
    ideaPath: backlog/future-ideas/retry-dashboard.md
    promotedWorkItemPath: backlog/feature-backlog/retry-dashboard.md
    ordinaryScanIncludesIdea: false
    expectedOutput: backlog item, Future Idea, or status update
    ideaBefore: |
      # Retry Dashboard
      ## Synopsis
      Consider a dashboard for retry visibility.
      ## Origin or Rationale
      Operators currently inspect several separate logs.
      ## Revisit Trigger
      Revisit when retry observability becomes planned work.
    ideaAfter: |
      # Retry Dashboard
      Promoted To: backlog/feature-backlog/retry-dashboard.md
      ## Synopsis
      Consider a dashboard for retry visibility.
      ## Origin or Rationale
      Operators currently inspect several separate logs.
      ## Revisit Trigger
      Revisit when retry observability becomes planned work.
    promotedWorkItem: |
      # Retry Dashboard
      Status: Ready
      Type: Feature
      Provider: file
      Provider Reference: backlog/feature-backlog/retry-dashboard.md
      Completion: direct-main
      ## Summary
      Deliver retry visibility.
      ## Context
      The promoted idea is now authorized work.
      ## Source Evidence
      - backlog/future-ideas/retry-dashboard.md
      ## Requirements
      - Define the operator view.
      ## Acceptance Criteria
      - Operators can inspect retry status.
      ## Dependencies
      None
      ## Verification
      - Run focused behavior checks.
      ## Open Questions
      None
    promotionTransaction:
      collision:
        result: BLOCKED
        writesAttempted: false
        ideaBefore: &promotion-idea-before |
          # Retry Dashboard
          ## Synopsis
          Consider a dashboard for retry visibility.
          ## Origin or Rationale
          Operators currently inspect several separate logs.
        ideaAfter: *promotion-idea-before
        targetExistedBefore: true
        targetBefore: &promotion-collision-target |
          # Existing Retry Dashboard Work
          Existing bytes must not be replaced.
        targetAfter: *promotion-collision-target
      injectedFailures:
        - boundary: target-write
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: idea-write
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: validation
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: commit
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
