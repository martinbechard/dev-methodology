schema: synthetic-agent-suite-cases
cases:
  creation-and-claim: {backend: files, request: webhook idempotency keys, initialStatus: absent}
  interrupted-work-recovery: {status: active, claim: stale, result: complete, verification: pass}
  blocked-state-transition:
    status: running
    owner: dev-coder
    claim: schema-migration-active
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    itemBefore: |
      # Schema Migration
      Status: Running
      Owner: dev-coder
      Claim: schema-migration-active
      Blocker: External schema decision is unavailable.
      Unblock Condition: Approved schema decision is recorded.
      Evidence: Existing schema analysis and verification log.
      Acceptance Criteria: Schema decision remains traceable; existing verification remains required.
  blocked-unowned-running-shortcut:
    status: blocked
    claim: null
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    unblockConditionSatisfied: true
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    claimOutcome: NOT_ATTEMPTED
    attemptedTransition: running
    itemBefore: &blocked-resumption-item |
      # Schema Migration
      Status: Blocked
      Owner: Unowned
      Claim: None
      Blocker: External schema decision is unavailable.
      Unblock Condition: Approved schema decision is recorded.
      Evidence: Existing schema analysis and verification log.
      Acceptance Criteria: Schema decision remains traceable; existing verification remains required.
  blocked-claimed-resumption:
    status: blocked
    claim: null
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    unblockConditionSatisfied: true
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    claimOutcome: SHARED_CHECKOUT_ACQUIRED
    newOwner: dev-coder
    newClaim: schema-migration-resumption
    requiredTransitions: [ready, claimed, running]
    itemBefore: *blocked-resumption-item
  blocked-failed-claim-resumption:
    status: blocked
    claim: null
    blocker: external schema decision
    unblockCondition: approved schema decision is recorded
    unblockConditionSatisfied: true
    acceptanceEvidence: [schema decision remains traceable, existing verification remains required]
    claimOutcome: CLAIM_SCOPE_CONFLICT_WAIT_REQUIRED
    otherFailedClaimOutcomes: [INVALID_SCOPE, DIRTY_CHECKOUT_RECOVERY_AUTHORIZATION_REQUIRED]
    requiredResult: byte-for-byte unchanged
    itemBefore: *blocked-resumption-item
  future-ideas-capture-and-promotion:
    provider: file
    nonFileProviderWithoutOverride: github
    nonFileProviderResult: BLOCKED with no issue and no shadow file
    explicitFileOverrideResult: capture under backlog/future-ideas
    ideaPath: backlog/future-ideas/retry-dashboard.md
    promotedWorkItemPath: backlog/feature-backlog/retry-dashboard.md
    ordinaryScanIncludesIdea: false
    expectedOutput: backlog item, Future Idea, or status update
    ideaBefore: |
      # Retry Dashboard
      ## Synopsis
      Consider a dashboard for retry visibility.
      ## Origin or Rationale
      Operators currently inspect several separate logs.
      ## Revisit Trigger
      Revisit when retry observability becomes planned work.
    ideaAfter: |
      # Retry Dashboard
      Promoted To: retry-dashboard
      ## Synopsis
      Consider a dashboard for retry visibility.
      ## Origin or Rationale
      Operators currently inspect several separate logs.
      ## Revisit Trigger
      Revisit when retry observability becomes planned work.
    promotedWorkItem: |
      # Retry Dashboard
      Status: Ready
      Type: Feature
      Provider: file
      Provider Reference: backlog/feature-backlog/retry-dashboard.md
      Work Item ID: retry-dashboard
      Completion: main-branch
      ## Summary
      Deliver retry visibility.
      ## Context
      The promoted idea is now authorized work.
      ## Source Evidence
      - backlog/future-ideas/retry-dashboard.md
      ## Requirements
      - Define the operator view.
      ## Acceptance Criteria
      - Operators can inspect retry status.
      ## Dependencies
      None
      ## Verification
      - Run focused behavior checks.
      ## Open Questions
      None
    promotionTransaction:
      gitIndex:
        preAttemptSnapshot: exact full file bytes and existence
        stagedPaths:
          - backlog/future-ideas/retry-dashboard.md
          - backlog/feature-backlog/retry-dashboard.md
        commitMode: path-limited
        preserveUnrelatedStagedState: true
        verifiedCommitPaths:
          - backlog/future-ideas/retry-dashboard.md
          - backlog/feature-backlog/retry-dashboard.md
        verifiedCommitReference: captured immutable commit OID
        failureRestoration: restore exact bytes and existence then verify
        rollbackFailure:
          status: BLOCKED
          recoveryOwner: Dev Backlog Steward
          preservedEvidence: worktree and Git index snapshots
      resourceCoordination:
        resource-claim:
          claimPaths:
            - backlog/future-ideas/retry-dashboard.md
            - backlog/feature-backlog/retry-dashboard.md
          claimLifecycle:
            - acquire both exact paths together in one operation before mutation
            - revalidate transaction snapshots after claims
            - release after success or safe verified rollback
            - retain after unsafe rollback or postcommit verification failure
        none:
          claimCalls: []
          claimEvidence: absent
      postClaimDrift:
        snapshotTiming: before exact-path claims
        requiredResult: zero-mutation BLOCKED
        injectedKinds:
          - source-bytes
          - source-type-and-authority
          - destination-appears
          - head
          - index
          - unrelated-worktree
      destinationClaimConflict:
        outcome: CLAIM_SCOPE_CONFLICT_WAIT_REQUIRED
        conflictingPath: backlog/feature-backlog/retry-dashboard.md
        expectedResult: zero-mutation BLOCKED with no retained new ownership
      collision:
        result: BLOCKED
        writesAttempted: false
        ideaBefore: &promotion-idea-before |
          # Retry Dashboard
          ## Synopsis
          Consider a dashboard for retry visibility.
          ## Origin or Rationale
          Operators currently inspect several separate logs.
        ideaAfter: *promotion-idea-before
        targetExistedBefore: true
        targetBefore: &promotion-collision-target |
          # Existing Retry Dashboard Work
          Existing bytes must not be replaced.
        targetAfter: *promotion-collision-target
      injectedFailures:
        - boundary: target-write
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: idea-write
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: validation
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: staging
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
        - boundary: commit
          ideaBefore: *promotion-idea-before
          ideaAfter: *promotion-idea-before
          targetExistedBefore: false
          targetBefore: absent
          targetAfter: absent
          cleanupScope: remove only a target created by this attempt
  future-ideas-inventory-and-validation:
    provider: file
    explicitlyRequested: true
    ordinaryLifecycleCount: 0
    expectedOutput: backlog item, Future Idea, or status update
    records:
      valid-retry-dashboard.md: |
        # Retry Dashboard
        ## Synopsis
        Consider a dashboard for retry visibility.
        ## Origin or Rationale
        Operators currently inspect several separate logs.
        ## Notes
        Keep the first iteration read-only.
        ## Revisit Trigger
        Revisit when retry observability becomes planned work.
        Promoted To: retry-dashboard
      z-duplicate-retry-dashboard.md: |
        # Retry Dashboard
        ## Synopsis
        Consider a dashboard for retry visibility.
        ## Origin or Rationale
        Operators currently inspect several separate logs.
      missing-origin.md: |
        # Missing Origin
        ## Synopsis
        This record is deliberately incomplete.
    authorityEscape:
      path: escaping-link.md
      externalBytes: EXTERNAL-BYTES-MUST-NOT-BE-READ
    expectedValidPaths:
      - backlog/future-ideas/valid-retry-dashboard.md
    expectedInvalidPaths:
      - backlog/future-ideas/escaping-link.md
      - backlog/future-ideas/missing-origin.md
      - backlog/future-ideas/z-duplicate-retry-dashboard.md
