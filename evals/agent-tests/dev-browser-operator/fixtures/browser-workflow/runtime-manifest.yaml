runtime: isolated-playwright
server:
  owner: safe-runtime-wrapper
  bindAddress: 127.0.0.1
  portSelection: os-assigned-ephemeral
browser:
  engine: repository-designated-chromium
  launch: fresh-headless-browser
  context: fresh-isolated-context
  page: fresh-page
  persistentProfile: false
healthRoute: /settings.html
successRoute: /missing-success.html
uploadRoute: /upload.html
storageRoute: /missing-storage
evidence:
  - trace
  - screenshots
  - console
  - requests-and-responses
  - runtime-browser-context-page-identities
  - fixture-root-and-selected-port
  - interaction-digest
  - close-receipts
cleanup:
  - close-page
  - close-context
  - close-browser
  - stop-server-and-release-port
