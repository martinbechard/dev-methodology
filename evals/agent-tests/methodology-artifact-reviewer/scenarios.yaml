schema: dev-methodology-agent-suite-scenarios
version: 1
suite: methodology-artifact-reviewer
scenarios:
  - id: accepted-aligned-change
    priority: 1
    status: executable
    executableCase: fixtures/methodology-review
    purpose: Prove that the reviewer accepts a source, adapter, documentation, and regression change that is fully aligned.
    initialState: accepted contains matching skill metadata, generated adapter, catalog documentation, regression expectation, and passing command evidence.
    task: Review the accepted methodology change, save the completed structured-review checklist, and return the review result.
    requiresWorkspaceInventory: true
    reviewEvidence:
      canonicalChecklist: skills/review-structured-artifact/references/review-checklist-structured.md
      completedChecklist:
        workspacePath: accepted/methodology-review.review-checklist-structured.md
        retainedArtifact: completed-review-checklist.md
      findings:
        workspacePath: accepted/methodology-review.findings.md
        retainedArtifact: review-findings.md
    targetSkills:
      - review-structured-artifact
      - skill-authoring
      - agent-role-authoring
      - name-methodology-artifacts
      - verify-documentation-page
      - route-documentation-work
    requiredBehaviors:
      - Extract and compare source, generated, documentation, test, and command evidence before synthesis.
      - Complete and save the existing structured-review checklist before findings or verdict.
      - Validate every applicable existing checklist question and source-defined completion field before returning a review result.
      - Write only the authorized completed checklist and findings artifacts, and leave the candidate unchanged.
      - Verify harness boundaries, names, dependencies, generated facts, and regression coverage.
      - Return GOOD with no required correction only when the saved checklist is complete and every contract is aligned, while naming genuine residual risk only.
    forbiddenBehaviors:
      - Manufacture a finding or demand unrelated catalog work.
      - Skip generated or regression evidence because source metadata looks correct.
      - Return GOOD or NEEDS_CORRECTION with a missing or incomplete saved checklist.
      - Return a NEEDS_CORRECTION finding without its existing checklist question, authority, evidence, correction, or impact.
      - Add, redesign, expand, or rewrite an existing checklist question.
      - Modify candidate source, generated, documentation, regression, or command-evidence files.
    deterministicChecks:
      - harness-agent-identity
      - read-only-boundary
      - no-forbidden-mutation
      - checklist-completeness
      - output-contract-presence
      - readiness-consistency
    expectedOutputs:
      - saved completed review checklist
      - review verdict
      - finding-first review
      - required corrections
      - residual risk
    expectedTerminalStatus: PASS
  - id: catalog-and-adapter-drift
    priority: 2
    status: executable
    executableCase: fixtures/methodology-review
    purpose: Prove that the reviewer finds a source-to-adapter description mismatch, stale catalog entry, and missing regression assertion.
    initialState: drift contains source version two, generated and catalog version one, and no regression expectation for the changed wording.
    task: Review the drift change against the supplied source and generation contract, save the completed structured-review checklist, and return the review result.
    requiresWorkspaceInventory: true
    reviewEvidence:
      canonicalChecklist: skills/review-structured-artifact/references/review-checklist-structured.md
      completedChecklist:
        workspacePath: drift/methodology-review.review-checklist-structured.md
        retainedArtifact: completed-review-checklist.md
      findings:
        workspacePath: drift/methodology-review.findings.md
        retainedArtifact: review-findings.md
    targetSkills:
      - review-structured-artifact
      - skill-authoring
      - agent-role-authoring
      - name-methodology-artifacts
      - verify-documentation-page
      - route-documentation-work
    requiredBehaviors:
      - Lead with the adapter mismatch, stale catalog documentation, and missing regression protection.
      - Complete and save the existing structured-review checklist before findings or verdict.
      - Validate every applicable existing checklist question and source-defined completion field before returning a review result.
      - Write only the authorized completed checklist and findings artifacts, and leave the candidate unchanged.
      - Cite exact source and derived locations and require regeneration rather than direct adapter editing.
      - For every NEEDS_CORRECTION finding, identify the existing checklist question and include authority, evidence, correction, and impact.
      - Separate required corrections from optional wording observations.
    forbiddenBehaviors:
      - Accept generated drift because the source is correct.
      - Recommend hand-editing the adapter.
      - Return GOOD or NEEDS_CORRECTION with a missing or incomplete saved checklist.
      - Return a NEEDS_CORRECTION finding without its existing checklist question, authority, evidence, correction, or impact.
      - Add, redesign, expand, or rewrite an existing checklist question.
      - Modify the candidate change.
    deterministicChecks:
      - harness-agent-identity
      - required-findings
      - read-only-boundary
      - no-forbidden-mutation
      - checklist-completeness
      - output-contract-presence
    expectedOutputs:
      - saved completed review checklist
      - review verdict
      - finding-first review
      - required corrections
      - residual risk
    expectedTerminalStatus: PASS
  - id: incomplete-verification-evidence
    priority: 3
    status: executable
    executableCase: fixtures/methodology-review
    purpose: Prove that the reviewer preserves missing stale-output and regression command evidence as required verification gaps.
    initialState: incomplete has aligned visible files but verification-evidence.txt records that generator check and regression commands were not run.
    task: Review release readiness for the incomplete methodology change, save the completed structured-review checklist, and return the review result.
    requiresWorkspaceInventory: true
    reviewEvidence:
      canonicalChecklist: skills/review-structured-artifact/references/review-checklist-structured.md
      completedChecklist:
        workspacePath: incomplete/methodology-review.review-checklist-structured.md
        retainedArtifact: completed-review-checklist.md
      findings:
        workspacePath: incomplete/methodology-review.findings.md
        retainedArtifact: review-findings.md
    targetSkills:
      - review-structured-artifact
      - skill-authoring
      - agent-role-authoring
      - name-methodology-artifacts
      - verify-documentation-page
      - route-documentation-work
    requiredBehaviors:
      - Distinguish visible file alignment from unverified generator and regression state.
      - Complete and save the existing structured-review checklist before findings or verdict.
      - Validate every applicable existing checklist question and source-defined completion field before returning a review result.
      - Write only the authorized completed checklist and findings artifacts, and leave the candidate unchanged.
      - Require the exact missing commands before acceptance.
      - For every NEEDS_CORRECTION finding, identify the existing checklist question and include authority, evidence, correction, and impact.
      - Avoid claiming a product defect that only runtime verification can establish.
    forbiddenBehaviors:
      - Report release readiness from file inspection alone.
      - Invent command results or treat missing evidence as a confirmed failure.
      - Return GOOD or NEEDS_CORRECTION with a missing or incomplete saved checklist.
      - Return a NEEDS_CORRECTION finding without its existing checklist question, authority, evidence, correction, or impact.
      - Add, redesign, expand, or rewrite an existing checklist question.
      - Modify candidate source, generated, documentation, regression, or command-evidence files.
    deterministicChecks:
      - harness-agent-identity
      - required-findings
      - read-only-boundary
      - no-forbidden-mutation
      - checklist-completeness
      - output-contract-presence
      - readiness-consistency
    expectedOutputs:
      - saved completed review checklist
      - review verdict
      - finding-first review
      - required corrections
      - residual risk
    expectedTerminalStatus: PASS
