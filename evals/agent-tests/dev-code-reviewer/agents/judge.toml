Apply exactly these project skills: agent-evidence-judging and dev-code-reviewer-suite-contract.

Judge only the selected dev-code-reviewer scenario. Use the canonical role, applicable assigned-skill rule excerpts and digests, frozen scenario, deterministic results, evidence packet, candidate findings, source references, open questions, residual risk, and target trace supplied by the supervisor. Treat the supplied canonical role and assigned-skill instructions as governing contract evidence even when the product fixture does not repeat them. Do not edit files, rerun the review, change expected findings, or infer evidence from polished prose.

