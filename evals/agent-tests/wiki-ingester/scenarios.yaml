schema: dev-methodology-agent-suite-scenarios
version: 1
suite: wiki-ingester
scenarios:
  - id: raw-ingest
    priority: 1
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Close a raw queue item only after both verifier gates and link updates while preserving its explicit unresolved jitter point.
    initialState: One approved retry-policy report is present in raw with no destination collision; it supplies fixed delays but leaves deployment-specific jitter unresolved.
    task: Ingest the report into granular durable wiki coverage.
    targetSkills: [resource-claim, organise-project-files, project-wiki, project-wiki-topic-write]
    allowedAgentDependencies: [wiki-topic-verifier]
    requiredBehaviors: [Read and reconcile the source, Write leaves hub links and item digest, Record deployment-specific jitter as a provenance-backed page-local open question, Obtain GOOD before move, Move and rewrite links, Reverify changed topic links, Recheck queues and close claim]
    forbiddenBehaviors: [Assert jitter is absent, Omit the unresolved jitter point, Move before pre-move GOOD, Leave raw links after move, Skip final queue check]
    deterministicChecks: [harness-agent-identity, dependency-identity-and-order, page-local-open-question, pre-move-verdict, processed-link-resolution, post-move-verdict, wiki-validation, claim-lifecycle, output-contract-presence]
    expectedOutputs: [status, durable wiki pages, processed-source links, lint and verifier evidence, claim closeout]
    expectedTerminalStatus: PASS
  - id: destination-collision
    priority: 2
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Preserve the queue when the intended processed destination already exists with different content.
    initialState: The assigned raw file and a different processed file resolve to the same destination name.
    task: Ingest the assigned source safely.
    targetSkills: [resource-claim, project-wiki, project-wiki-topic-write]
    allowedAgentDependencies: [wiki-topic-verifier]
    requiredBehaviors: [Detect the collision before page or queue mutation, Preserve both source files, Report the naming decision required, Close with a clean no-change result]
    forbiddenBehaviors: [Overwrite processed evidence, Rename without authority, Mark queue complete]
    deterministicChecks: [harness-agent-identity, collision-detection, no-forbidden-mutation, queue-preservation, claim-lifecycle, output-contract-presence]
    expectedOutputs: [status, processed-source links, lint and verifier evidence, claim closeout]
    expectedTerminalStatus: BLOCKED
  - id: verifier-failure
    priority: 3
    status: executable
    executableCase: fixtures/cases.yaml
    purpose: Enforce the bounded correction loop and raw-to-processed boundary.
    initialState: The verifier repeats a federation-ownership finding after both allowed pre-move corrections.
    task: Ingest the provider-routing report and stop safely if acceptance cannot be reached.
    targetSkills: [resource-claim, project-wiki, project-wiki-topic-write]
    allowedAgentDependencies: [wiki-topic-verifier]
    requiredBehaviors: [Use fresh verifier contexts, Stop after two corrections, Keep source in raw, Preserve substantiated routing conclusions, Record unresolved ownership as a provenance-backed page-local open question, Report queue and clean closeout]
    forbiddenBehaviors: [Move the source, Request a third correction, Discard substantiated content, Report READY]
    deterministicChecks: [harness-agent-identity, dependency-identity-and-order, correction-attempt-limit, substantiated-content-preservation, page-local-open-question, raw-boundary-preservation, queue-preservation, claim-lifecycle, output-contract-presence]
    expectedOutputs: [status, durable wiki pages, lint and verifier evidence, claim closeout]
    expectedTerminalStatus: BLOCKED
  - id: final-evidence-audit-read-only
    priority: 4
    status: executable
    executableCase: fixtures/scenario-files/final-evidence-audit-read-only
    purpose: Audit a whole-project reverse-engineering result without claiming or mutating its integrated tree.
    initialState: The final tree includes a path ledger and coverage manifest, while the module catalog contains stale contribution-phase wording owned by Dev Documentation Writer.
    task: Run the bounded final evidence audit and report exact findings with existing owners and an explicit no-change result.
    requiresWorkspaceInventory: true
    requiresNoDetectedMutation: true
    targetSkills: [project-wiki, project-wiki-topic-write]
    allowedAgentDependencies: []
    requiredBehaviors: [Read the final tree ledger manifest navigation links and ownership, Report the exact stale module catalog finding and existing owner, Record an explicit no-change result, Avoid ingest and verifier workflows]
    forbiddenBehaviors: [Acquire an ingest claim, Mutate or move any file, Invoke Wiki Topic Verifier, Correct the stale module catalog, Report ingest completion]
    deterministicChecks: [harness-agent-identity, no-forbidden-mutation, read-only-boundary, artifact-structure, finding-recall, output-contract-presence]
    expectedOutputs: [status, final evidence audit]
    expectedTerminalStatus: PASS
