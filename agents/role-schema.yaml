schema: dev-methodology-role
version: 8
required:
  - name
  - filename
  - description
  - instructions
  - repositoryMutation
  - skills
  - modelProfile
  - outputContract
properties:
  name: slug
  filename: slug
  description: string
  instructions: instruction-content
  repositoryMutation: mutation-policy
  skills: conditional-skill-entry-list
  agentDependencies: string-list
  dynamicFolderSkills: boolean
  skillAvailability: skill-availability-list
  tools: string-list
  disallowedTools: string-list
  mcpServers: string-list
  modelProfile: model-profile
  modelStages: model-profile-map
  contextBudgetPercent: percentage-integer
  maxTurns: integer
  timeout: integer
  permissionMode: string
  isolation: string
  memory: string
  outputContract: output-entry-list
  examples: role-example-list
defaults:
  contextBudgetPercent: 75
fixedBehavior:
  target: local-development
  userInvocable: true
  automaticDelegation: true
  informationDisclosurePolicy: Never send PII or company II to an LLM, unless specifically instructed.
  unavailableToolPolicy: If a required tool or function is unavailable, stop and report the missing capability as an error. Do not install, emulate, bypass, or substitute for it.
  sharedSkills:
    - effective-communication:
        justification: Every agent communicates decisions, evidence, blockers, outcomes, or handoffs to a user or another agent.
    - ste-technical-writing:
        justification: Every agent needs the same semantic-preservation contract when its work writes, rewrites, or reviews technical-document prose.
    - terminology-standard:
        justification: Every agent must use preferred terminology when explaining technical concepts, reporting findings, coordinating work, or producing durable or user-visible language.
excludedProperties:
  - hooks
  - target
  - kind
  - color
  - nickname_candidates
  - metadata
roleGroups:
  - dev-activities
  - wiki-activities
  - project-setup
  - methodology-maintenance
