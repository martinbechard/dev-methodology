schema: dev-methodology-model-profiles
version: 1
profiles:
  simple:
    purpose: Extraction, classification, lookup, and mechanical evidence checks.
  default:
    purpose: Normal implementation, documentation, and bounded verification work.
  documentation:
    purpose: Source-backed documentation authoring that requires advanced synthesis without changing unrelated default-profile agents.
  advanced:
    purpose: Review synthesis, architecture, diagnosis, and difficult implementation work.
  advanced-long:
    purpose: Advanced reasoning over unusually large evidence sets or cross-project context.
  skill-lint:
    purpose: Critical-only skill review that prioritizes contradictions, unsafe boundaries, and maintainability risks without reporting minor nits.
