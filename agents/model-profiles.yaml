schema: dev-methodology-model-profiles
version: 1
profiles:
  simple:
    purpose: Extraction, classification, lookup, and mechanical evidence checks.
  coordination:
    purpose: Bounded dispatch, completeness validation, evidence reconciliation, and deterministic ranking.
  default:
    purpose: Normal implementation, documentation, and bounded verification work.
  implementation:
    purpose: Scoped source implementation that needs capable synthesis at moderate reasoning effort.
  verification:
    purpose: Focused review and verification that needs capable interpretation at low reasoning effort.
  documentation:
    purpose: Source-backed documentation authoring that requires advanced synthesis without changing unrelated default-profile agents.
  advanced:
    purpose: Review synthesis, architecture, diagnosis, and difficult implementation work.
  advanced-long:
    purpose: Advanced reasoning over unusually large evidence sets or cross-project context.
  intermediate:
    purpose: Work that needs more scrutiny than simple extraction but less broad synthesis than the default profile.
